# Single source of truth for the Ghidra version this extension targets (bead grm-9r7).
#
# Everything else derives from this value by convention rather than repeating it:
#   - install dir:     D:/ghidra_<ver>_PUBLIC  -- build.gradle's version guard fails the
#                      build if the resolved GHIDRA_INSTALL_DIR's application.version
#                      disagrees; tools/banktest scripts default their install path from it
#   - source checkout: D:\git\ghidra kept on tag Ghidra_<ver>_build (see CLAUDE.md,
#                      "Reading Ghidra source code")
#
# Retargeting to a new Ghidra release: install it under D:/ per the convention, move the
# D:\git\ghidra checkout to the new tag, update this one line, then let the build guard and
# the full test gate surface anything that disagrees.
ghidraTargetVersion=12.1.2
