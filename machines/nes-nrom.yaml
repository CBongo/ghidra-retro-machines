# NES NROM (iNES mapper 0) board descriptor — M1 "NROM baseline" of bead grm-9ux.
# This is a SHIPPING descriptor (unlike the schema sketches in sketches/). All hardware
# facts cross-checked against the NESdev wiki:
#   - https://www.nesdev.org/wiki/NROM (board layout, PRG sizes, mirroring)
#   - https://www.nesdev.org/wiki/PPU_registers ($2000-$2007)
#   - https://www.nesdev.org/wiki/APU and /wiki/2A03 ($4000-$401F, test mode)
# NROM has no banking — PRG is fixed; CHR/PPU address space deferred (vision doc §5.4).

schema: 2

include: fragments/nes-common.yaml

system:
  id: nes_nrom
  name: NES NROM (iNES mapper 0)
  board:
    ines_mappers: [0]        # board registry key: iNES mapper numbers this board serves
  cpu:
    language: "6502:LE:16:default"   # 2A03 = 6502 minus decimal mode; stock language suffices

physical:
  # PRG ROM laid out once, in file order. No size: — it comes from the iNES header
  # (PRG-ROM size field): 16 KiB for NROM-128 or 32 KiB for NROM-256.
  - { name: PRG, image: prg_rom }

memory:
  # No PRG-RAM region at $6000 — NROM boards carry none (Family Basic's variant excepted).
  # PPU/CHR address space: out of scope for the CPU map (vision doc §5.4 defers non-CPU spaces).

  windows:                        # computed occupants — fixed slices of PRG, no bank state
    # No on_write: NROM has no mapper latch; stores into $8000-$FFFF are ignored (open bus).
    - name: PRG_LO                # first 16 KiB of the image
      start: 0x8000
      end: 0xBFFF
      maps: PRG[0]
    - name: PRG_HI                # last 16 KiB of the image
      start: 0xC000
      end: 0xFFFF
      # `last` = image size minus window size: NROM-256 gets its upper 16 KiB; NROM-128
      # mirrors its single bank (hardware truth: A14 is not decoded on NROM-128).
      maps: PRG[last]

# No banking: section — NROM is unbanked; schema v2 makes banking optional.

# rom_images: omitted — PRG comes from the .nes container payload, not a user-supplied slot.

validation:
  oracle: Mesen
  checks:
    - "NES_PPU/NES_APU_IO struct offsets vs NESdev wiki PPU_registers and APU register tables"
    - "NROM-128 PRG mirroring at $C000 (PRG[last] == PRG[0]) vs Mesen memory viewer"
