# NES AxROM board descriptor (iNES mapper 7) — SHIPPING descriptor (bead grm-9ux M2).
# All hardware facts cross-checked against the NESdev wiki:
#   - https://www.nesdev.org/wiki/AxROM (board layout, latch behavior)
#   - https://www.nesdev.org/wiki/PPU_registers ($2000-$2007)
#   - https://www.nesdev.org/wiki/APU and /wiki/2A03 ($4000-$401F, test mode)
# AxROM switches the entire 32 KiB PRG window at once — there is no fixed bank, so games
# must keep valid reset/NMI/IRQ vectors in every bank (unlike UxROM's fixed-$C000 safety
# net). CHR/PPU address space deferred (vision doc §5.4). No PRG-RAM at $6000 in AxROM's
# basic config, so no region is declared for it.

schema: 2

include: fragments/nes-common.yaml

system:
  id: nes_axrom
  name: NES AxROM (iNES mapper 7)
  board:
    ines_mappers: [7]        # board registry key: iNES mapper numbers this board serves
  cpu:
    language: "6502:LE:16:default"   # 2A03 = 6502 minus decimal mode; stock language suffices

physical:
  # PRG ROM laid out once, in file order. No size: — it comes from the iNES header
  # (PRG-ROM size field).
  - { name: PRG, image: prg_rom }

memory:
  # No PRG-RAM region at $6000 — AxROM's basic config carries none.
  # PPU/CHR address space: out of scope for the CPU map (vision doc §5.4 defers non-CPU spaces).

  windows:
    - name: PRG_ALL                # whole 32 KiB switchable — no fixed bank
      start: 0x8000
      end: 0xFFFF
      maps: PRG[bank * 0x8000]
      on_write: mechanism          # stores here are mapper latch writes, not memory writes

banking:
  state:
    - { name: bank, bits: 3 }      # up to 256 KiB PRG (8 * 32 KiB)
  mechanisms:
    - strategy: memory-latch      # a store anywhere in [start,end] latches the bank
      # Written bit 4 selects the one-screen VRAM page (PPU concern, untracked here).
      # Bus-conflict behavior varies by PCB: AMROM/AOROM conflict, ANROM does not; false
      # is the safe recovery assumption since conflict-board games self-avoid conflicts
      # anyway (they must, to work on the conflicting boards).
      params: { start: 0x8000, end: 0xFFFF, mask: 0x07, bus_conflict: false }
      sets: [bank]
  # No states: table — occupants are computed from the maps: expressions, not enumerated.
  # Power-on latch state is electrically undefined; 0 is the conventional assumption.
  initial_state: { bank: 0 }

# rom_images: omitted — PRG comes from the .nes container payload, not a user-supplied slot.

validation:
  oracle: Mesen
  checks:
    - "NES_PPU/NES_APU_IO struct offsets vs NESdev wiki PPU_registers and APU register tables"
    - "AxROM 32 KiB whole-window latch (no fixed bank) vs Mesen memory viewer / mapper 7 source"
