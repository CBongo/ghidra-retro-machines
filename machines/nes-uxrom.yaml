# NES UxROM board descriptor (iNES mapper 2) — SHIPPING descriptor (bead grm-9ux M2).
# All hardware facts cross-checked against the NESdev wiki:
#   - https://www.nesdev.org/wiki/UxROM (board layout, latch behavior, bus conflicts)
#   - https://www.nesdev.org/wiki/PPU_registers ($2000-$2007)
#   - https://www.nesdev.org/wiki/APU and /wiki/2A03 ($4000-$401F, test mode)
# UxROM switches a 16 KiB PRG window; the top 16 KiB is fixed to the last bank.
# CHR/PPU address space deferred (vision doc §5.4). No PRG-RAM at $6000 in the basic
# UxROM config, so no region is declared for it.
# NOTE: iNES mappers 94 (UN1ROM) and 180 (Crazy Climber) are distinct UxROM-family
# variants (different latch bits / fixed-bank position) and are NOT claimed by this
# descriptor.

schema: 2

include: fragments/nes-common.yaml

system:
  id: nes_uxrom
  name: NES UxROM (iNES mapper 2)
  board:
    ines_mappers: [2]        # board registry key: iNES mapper numbers this board serves
  cpu:
    language: "6502:LE:16:default"   # 2A03 = 6502 minus decimal mode; stock language suffices

physical:
  # PRG ROM laid out once, in file order. No size: — it comes from the iNES header
  # (PRG-ROM size field).
  - { name: PRG, image: prg_rom }

memory:
  # No PRG-RAM region at $6000 — UxROM's basic config carries none.
  # PPU/CHR address space: out of scope for the CPU map (vision doc §5.4 defers non-CPU spaces).

  windows:                        # computed occupants — slices of PRG driven by bank state
    - name: PRG_LO                # switchable 16 KiB bank
      start: 0x8000
      end: 0xBFFF
      maps: PRG[bank * 0x4000]
      on_write: mechanism         # stores here are mapper latch writes, not memory writes
    - name: PRG_HI                # fixed to the last 16 KiB bank in the image
      start: 0xC000
      end: 0xFFFF
      maps: PRG[last]
      on_write: mechanism         # writes anywhere in $8000-$FFFF hit the same latch

banking:
  state:
    # UNROM has 8 banks (3 bits), UOROM 16 (4 bits); 4 bits covers the whole family —
    # banks beyond the actual image size simply don't exist.
    - { name: bank, bits: 4 }
  mechanisms:
    - strategy: memory-latch      # a store anywhere in [start,end] latches the bank
      # UNROM has no bus isolation — the CPU-driven value is ANDed with the ROM byte at
      # the written address, so games write to a location whose ROM byte equals the
      # intended bank (the classic bank-number table). bus_conflict tells the analyzer
      # to apply that AND when recovering the intended value.
      params: { start: 0x8000, end: 0xFFFF, mask: 0x0F, bus_conflict: true }
      sets: [bank]
  # No states: table — occupants are computed from the maps: expressions, not enumerated.
  # Power-on latch state is electrically undefined; 0 is the conventional assumption
  # (reset code runs from the fixed $C000 window regardless).
  initial_state: { bank: 0 }

# rom_images: omitted — PRG comes from the .nes container payload, not a user-supplied slot.

validation:
  oracle: Mesen
  checks:
    - "NES_PPU/NES_APU_IO struct offsets vs NESdev wiki PPU_registers and APU register tables"
    - "UxROM latch behavior (bank-number-table bus conflict) vs Mesen memory viewer / mapper 2 source"
