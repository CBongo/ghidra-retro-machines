# NES CNROM board descriptor (iNES mapper 3) — SHIPPING descriptor (bead grm-9ux M2).
# All hardware facts cross-checked against the NESdev wiki:
#   - https://www.nesdev.org/wiki/CNROM (board layout, CHR latch)
#   - https://www.nesdev.org/wiki/PPU_registers ($2000-$2007)
#   - https://www.nesdev.org/wiki/APU and /wiki/2A03 ($4000-$401F, test mode)
# CNROM's PRG is fixed (NROM-style, no PRG banking); the mapper latch instead selects
# an 8 KiB CHR (PPU) bank. CHR/PPU address space is out of scope for the CPU map (vision
# doc §5.4), so tracking the latch here yields disassembly annotations at switch sites
# only — no CPU-visible window changes result from it.
# No PRG-RAM at $6000 in CNROM's basic config, so no region is declared for it.

schema: 2

include: fragments/nes-common.yaml

system:
  id: nes_cnrom
  name: NES CNROM (iNES mapper 3)
  board:
    ines_mappers: [3]        # board registry key: iNES mapper numbers this board serves
  cpu:
    language: "6502:LE:16:default"   # 2A03 = 6502 minus decimal mode; stock language suffices

physical:
  # PRG ROM laid out once, in file order. No size: — it comes from the iNES header
  # (PRG-ROM size field).
  - { name: PRG, image: prg_rom }

memory:
  # No PRG-RAM region at $6000 — CNROM's basic config carries none.
  # PPU/CHR address space: out of scope for the CPU map (vision doc §5.4 defers non-CPU spaces).

  windows:                        # PRG is fixed, same layout as NROM — but both ranges are
                                   # mapper-latch writable (the CHR latch is written through
                                   # the ROM range).
    - name: PRG_LO                # first 16 KiB of the image
      start: 0x8000
      end: 0xBFFF
      maps: PRG[0]
      on_write: mechanism         # stores here latch the CHR bank, not memory writes
    - name: PRG_HI                # last 16 KiB of the image
      start: 0xC000
      end: 0xFFFF
      maps: PRG[last]
      on_write: mechanism         # stores here latch the CHR bank, not memory writes

banking:
  state:
    - { name: chr_bank, bits: 2 }
  mechanisms:
    - strategy: memory-latch      # a store anywhere in [start,end] latches the bank
      # The latch selects an 8 KiB CHR (PPU) bank only — there is no CPU-visible window
      # change from this write; tracking it yields disassembly annotations at switch
      # sites, nothing more. CHR/PPU address space itself is deferred (vision doc §5.4).
      params: { start: 0x8000, end: 0xFFFF, mask: 0x03, bus_conflict: true }
      sets: [chr_bank]
  # No states: table — occupants are computed from the maps: expressions, not enumerated.
  # Power-on latch state is electrically undefined; 0 is the conventional assumption.
  initial_state: { chr_bank: 0 }

# rom_images: omitted — PRG comes from the .nes container payload, not a user-supplied slot.

validation:
  oracle: Mesen
  checks:
    - "NES_PPU/NES_APU_IO struct offsets vs NESdev wiki PPU_registers and APU register tables"
    - "CNROM CHR latch (8 KiB bank select, no PRG banking) vs Mesen memory viewer / mapper 3 source"
