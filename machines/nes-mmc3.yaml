# NES MMC3 board descriptor (iNES mapper 4) — SHIPPING descriptor (bead grm-6a7.1).
# Promoted from machines/sketches/nes-mmc3.yaml's schema-validation sketch, with two
# hardware-accuracy corrections made during promotion (the sketch predates the
# select-data strategy design and got both wrong):
#   1. The sketch modeled bank-select/bank-data as two FIXED addresses ($8000/$8001).
#      Real MMC3 mirrors both registers across the whole $8000-$9FFF range (even
#      address = select, odd address = data, recognized by address parity, not by two
#      fixed addresses) -- https://www.nesdev.org/wiki/MMC3.
#   2. The sketch used a separate `mode-register` mechanism instance to track prg_mode
#      (bank-select bit 6) alongside a `select-data` mechanism for R6/R7. In reality bit
#      6 is CO-EMITTED from the very same select-register write that carries the target
#      index in bits 0-2 -- there is no independent mode register to latch, so a second
#      mechanism watching the same physical write would double-count it and race the
#      real one under the engine's first-match-wins mechanism dispatch. This descriptor
#      uses ONE select-data mechanism whose params carry both select_field and
#      mode_field, folded from the same recovered byte (SelectDataBankSwitchStrategy).
#
# Hardware facts (NESdev wiki, https://www.nesdev.org/wiki/MMC3):
#   $8000-$9FFE even write = BANK SELECT: bits 0-2 pick the target register R0-R7,
#     bit 6 = PRG mode (bank-select/bank-data mirrored across the whole $8000-$9FFF).
#   $8001-$9FFF odd write  = BANK DATA: writes the register the last select picked.
#   R0-R5 are CHR banks (out of scope here -- vision doc §5.4 defers non-CPU spaces);
#     R6/R7 are 6-bit PRG banks (8 KiB units).
#   PRG mode 0: $8000=R6 (switch), $A000=R7 (switch), $C000=second-to-last (fixed),
#               $E000=last (fixed).
#   PRG mode 1: $8000 and $C000 swap roles ($8000=second-to-last fixed, $C000=R6
#               switch); $A000/$E000 unchanged -- WA000 and WE000 are therefore
#               IDENTICAL across both memory.layouts[] entries below and get
#               invariant-hoisted by DescriptorSupport.planWindows (no _M-qualified
#               overlay names for them; see tools/banktest/mknesbanktest.py's mmc3
#               fixture, which exercises exactly this).
#   MMC3's scanline IRQ counter registers ($C000-$FFFF even/odd writes) are NOT
#   modeled: they alias the same CPU addresses as the WC000/WE000 PRG windows, but
#   the select-data mechanism below only recognizes writes in [$8000,$9FFF], so a
#   write at $C000+ simply isn't a mechanism write at all (falls through untracked);
#   the windows' on_write: mechanism still keeps such writes from being misretargeted
#   as ordinary memory writes.

schema: 2

system:
  id: nes_mmc3
  name: NES MMC3 (iNES mapper 4)
  board:
    ines_mappers: [4]        # board registry key: iNES mapper numbers this board serves
  cpu:
    # Stock 6502 language -- the 2A03 core is a 6502 minus decimal mode, invisible here.
    language: "6502:LE:16:default"

physical:
  # PRG ROM laid out once, in file order. No size: — it comes from the iNES header
  # (PRG-ROM size field) at load time.
  - { name: PRG, image: prg_rom }

memory:
  regions:                        # always visible, never banked
    - name: RAM
      start: 0x0000
      end: 0x07FF
      kind: ram
      comment: "2 KiB internal RAM; mirrored at $0800-$1FFF (mirrors noted, not modeled)"
    - name: PPU_REGS
      start: 0x2000
      end: 0x2007
      kind: io
      type: NES_PPU
      comment: "PPU registers; mirrored every 8 bytes through $3FFF (mirrors noted, not modeled)"
    - name: APU_IO
      start: 0x4000
      end: 0x401F
      kind: io
      type: NES_APU_IO
      comment: "APU, OAM DMA, controller, and 2A03 test-mode registers"
    - name: PRG_RAM
      start: 0x6000
      end: 0x7FFF
      kind: ram
      comment: "8 KiB PRG RAM; enable/write-protect bits ($A001) out of scope here"
  # PPU/CHR address space: out of scope for the CPU map (vision doc §5.4 defers non-CPU spaces).

  windows: []                     # every PRG window is mode-dependent -- see layouts

  layouts:
    # The four 8 KiB PRG windows, selected by the prg_mode bit (bank-select $8000 bit 6).
    # Writes anywhere in $8000-$FFFF land on a mapper register of some kind, hence
    # on_write: mechanism throughout (even where the select-data mechanism itself only
    # recognizes $8000-$9FFF -- see the IRQ-register note above).
    - when: { prg_mode: 0 }
      windows:
        - { name: W8000, start: 0x8000, size: 0x2000, maps: "PRG[r6 * 0x2000]", on_write: mechanism }
        - { name: WA000, start: 0xA000, size: 0x2000, maps: "PRG[r7 * 0x2000]", on_write: mechanism }
        - { name: WC000, start: 0xC000, size: 0x2000, maps: "PRG[second_last]", on_write: mechanism }
        - { name: WE000, start: 0xE000, size: 0x2000, maps: "PRG[last]",        on_write: mechanism }
    # prg_mode 1: $8000 and $C000 swap roles; $A000 and $E000 are unchanged (and so are
    # hoisted to memory-invariant windows by the planner -- identical definitions below).
    - when: { prg_mode: 1 }
      windows:
        - { name: W8000, start: 0x8000, size: 0x2000, maps: "PRG[second_last]", on_write: mechanism }
        - { name: WA000, start: 0xA000, size: 0x2000, maps: "PRG[r7 * 0x2000]", on_write: mechanism }
        - { name: WC000, start: 0xC000, size: 0x2000, maps: "PRG[r6 * 0x2000]", on_write: mechanism }
        - { name: WE000, start: 0xE000, size: 0x2000, maps: "PRG[last]",        on_write: mechanism }

banking:
  state:
    # LSB-first packing. `select` (bank-select's low 3 bits, the R0-R7 target index) and
    # `prg_mode` (bank-select bit 6) are co-emitted from the SAME even-address write;
    # r6/r7 are the two tracked PRG registers (R0-R5 are CHR, untracked).
    - { name: select,   bits: 3 }
    - { name: prg_mode, bits: 1 }
    - { name: r6,       bits: 6 }
    - { name: r7,       bits: 6 }
  mechanisms:
    # MMC3 bank switching is an even/odd register pair mirrored across $8000-$9FFF: the
    # even address (bank select) picks a target register via its low 3 bits and carries
    # the PRG mode in bit 6; the odd address (bank data) writes whichever register the
    # last select picked. Only targets 6/7 are PRG registers -- a data write targeting
    # 0-5 (CHR) is recognized but deliberately left a no-op on every tracked field (see
    # SelectDataBankSwitchStrategy's class javadoc for the no-poison contract).
    - strategy: select-data
      params:
        start: 0x8000
        end: 0x9FFF
        select_field: select
        select_mask: 0x07
        select_shift: 0
        mode_field: prg_mode
        mode_mask: 0x40
        mode_shift: 6
        targets: { 6: r6, 7: r7 }
      sets: [select, prg_mode, r6, r7]
  # DEVIATION (matches nes-uxrom.yaml/nes-modetest.yaml): MapCompiler.buildBanking()
  # unconditionally requires context_register: whenever banking: is present; no NES
  # language declares one yet, so this stays the same provisional placeholder name used
  # by every other NES board descriptor until a bundled 2A03/6502 language adds it.
  context_register: nesbank
  # Power-on register contents are undefined; all-zeros is the conventional assumption
  # for select/prg_mode/r6, EXCEPT r7, which is deliberately seeded to 1 (not 0) so that
  # WA000's home-in-base bank (the initial-state r7 value) differs from bank 0 -- this
  # makes any reference to WA000's bank 0 content distinguishable from "the home bank
  # happens to be bank 0" in the banktest fixture and its goldens.
  initial_state: { select: 0, prg_mode: 0, r6: 0, r7: 1 }
  # No states: table -- occupants are computed from the layouts' maps: expressions.

symbols:
  - set: nes-mmio
    default: on
    inline:
      - { addr: 0x2000, name: PPUCTRL,   kind: label, comment: "NMI enable, pattern/nametable select" }
      - { addr: 0x2001, name: PPUMASK,   kind: label, comment: "render enable, color emphasis" }
      - { addr: 0x2002, name: PPUSTATUS, kind: label, comment: "vblank/sprite0 flags; read clears latch" }
      - { addr: 0x2003, name: OAMADDR,   kind: label }
      - { addr: 0x2004, name: OAMDATA,   kind: label }
      - { addr: 0x2005, name: PPUSCROLL, kind: label, comment: "x/y scroll (two writes)" }
      - { addr: 0x2006, name: PPUADDR,   kind: label, comment: "VRAM address (two writes)" }
      - { addr: 0x2007, name: PPUDATA,   kind: label, comment: "VRAM data port" }
      - { addr: 0x4014, name: OAMDMA,    kind: label, comment: "OAM DMA source page" }
      - { addr: 0x4015, name: SND_CHN,   kind: label, comment: "APU channel enable/status" }
      - { addr: 0x4016, name: JOY1,      kind: label, comment: "controller 1 / strobe" }
      - { addr: 0x4017, name: JOY2,      kind: label, comment: "controller 2 / APU frame counter" }
      - { addr: 0xFFFA, name: NMI_VEC,   kind: vector }
      - { addr: 0xFFFC, name: RESET_VEC, kind: vector }
      - { addr: 0xFFFE, name: IRQ_VEC,   kind: vector }

# types: duplicated verbatim from machines/nes-nrom.yaml (NES_PPU/NES_APU_IO structs are
# identical across all NES boards). Accepted cost until an include mechanism lands.
types:
  - name: NES_PPU
    kind: struct
    fields:
      - { offset: 0, name: PPUCTRL,   size: 1, comment: "NMI enable, sprite size, bg/sprite pattern table, VRAM increment, base nametable" }
      - { offset: 1, name: PPUMASK,   size: 1, comment: "color emphasis, sprite/bg enable, greyscale" }
      - { offset: 2, name: PPUSTATUS, size: 1, comment: "vblank, sprite 0 hit, sprite overflow (read resets $2005/$2006 latch)" }
      - { offset: 3, name: OAMADDR,   size: 1 }
      - { offset: 4, name: OAMDATA,   size: 1 }
      - { offset: 5, name: PPUSCROLL, size: 1, comment: "x/y scroll (two writes)" }
      - { offset: 6, name: PPUADDR,   size: 1, comment: "VRAM address (two writes, high then low)" }
      - { offset: 7, name: PPUDATA,   size: 1, comment: "VRAM read/write (buffered reads)" }
  - name: NES_APU_IO
    kind: struct
    fields:
      - { offset: 0,  name: SQ1_VOL,    size: 1, comment: "pulse 1 duty, envelope" }
      - { offset: 1,  name: SQ1_SWEEP,  size: 1 }
      - { offset: 2,  name: SQ1_LO,     size: 1, comment: "pulse 1 timer low" }
      - { offset: 3,  name: SQ1_HI,     size: 1, comment: "pulse 1 length counter load, timer high" }
      - { offset: 4,  name: SQ2_VOL,    size: 1, comment: "pulse 2 duty, envelope" }
      - { offset: 5,  name: SQ2_SWEEP,  size: 1 }
      - { offset: 6,  name: SQ2_LO,     size: 1, comment: "pulse 2 timer low" }
      - { offset: 7,  name: SQ2_HI,     size: 1, comment: "pulse 2 length counter load, timer high" }
      - { offset: 8,  name: TRI_LINEAR, size: 1, comment: "triangle linear counter" }
      - { offset: 9,  name: UNUSED_4009, size: 1 }
      - { offset: 10, name: TRI_LO,     size: 1, comment: "triangle timer low" }
      - { offset: 11, name: TRI_HI,     size: 1, comment: "triangle length counter load, timer high" }
      - { offset: 12, name: NOISE_VOL,  size: 1, comment: "noise envelope" }
      - { offset: 13, name: UNUSED_400D, size: 1 }
      - { offset: 14, name: NOISE_LO,   size: 1, comment: "noise mode, period" }
      - { offset: 15, name: NOISE_HI,   size: 1, comment: "noise length counter load" }
      - { offset: 16, name: DMC_FREQ,   size: 1, comment: "DMC IRQ enable, loop, rate" }
      - { offset: 17, name: DMC_RAW,    size: 1, comment: "DMC direct load (7-bit DAC)" }
      - { offset: 18, name: DMC_START,  size: 1, comment: "DMC sample address" }
      - { offset: 19, name: DMC_LEN,    size: 1, comment: "DMC sample length" }
      - { offset: 20, name: OAMDMA,     size: 1, comment: "OAM DMA source page (write suspends CPU ~513 cycles)" }
      - { offset: 21, name: SND_CHN,    size: 1, comment: "channel enable (write) / status (read)" }
      - { offset: 22, name: JOY1,       size: 1, comment: "controller 1 data (read) / strobe (write)" }
      - { offset: 23, name: JOY2,       size: 1, comment: "controller 2 data (read) / APU frame counter (write)" }
      - { offset: 24, name: TEST_4018,  size: 1, comment: "2A03 test mode" }
      - { offset: 25, name: TEST_4019,  size: 1, comment: "2A03 test mode" }
      - { offset: 26, name: TEST_401A,  size: 1, comment: "2A03 test mode" }
      - { offset: 27, name: TEST_401B,  size: 1, comment: "2A03 test mode" }
      - { offset: 28, name: TEST_401C,  size: 1, comment: "2A03 test mode" }
      - { offset: 29, name: TEST_401D,  size: 1, comment: "2A03 test mode" }
      - { offset: 30, name: TEST_401E,  size: 1, comment: "2A03 test mode" }
      - { offset: 31, name: TEST_401F,  size: 1, comment: "2A03 test mode" }

formats:
  ines:
    extensions: [".nes"]

# rom_images: omitted -- PRG comes from the .nes container payload, not a user-supplied slot.

validation:
  oracle: none
  checks:
    - "PRG-side bank layout and select/data register shape cross-checked against the
       NESdev wiki (https://www.nesdev.org/wiki/MMC3); no emulator oracle run yet.
       Verified against the banktest suite's runtime behavior (bead grm-6a7.1).
       CHR banking, nametable mirroring, PRG-RAM write-protect, and the scanline IRQ
       counter are all out of scope (vision doc §5.4 / this bead)."
