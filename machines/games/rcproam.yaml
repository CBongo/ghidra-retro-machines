# Curated per-game descriptor (title tier). Compiled to data/games/rcproam.gmap.
# docs/per-game-descriptors-design.md; bead grm-hvc1 (2026-09-21), sibling of drmario.yaml
# and tetris.yaml (grm-tsii).
#
# WHY THIS FILE EXISTS. machines/nes-mmc1.yaml's home layout is PRG mode 3 (fix-last), and that
# default is HARDWARE-GROUNDED: the MMC1 control register really does reset with bits 2-3 set,
# and the descriptor models it ("reset": {"prg_mode": 3}). But it describes t=0 only. This
# cartridge reprograms the control register to mode 0 (one 32 KiB window at $8000-$FFFF) during
# init and stays there. The pinned golden looked "mixed" (eight prg_mode=0 bank comments plus
# two prg_mode=3 ones at ff85/ffea), which is why grm-tsii deliberately left rcproam unhinted;
# the owner's GUI read (2026-09-19, grm-hvc1) settled it: every site that writes the control
# register sets the PRG-mode bits to 0, and ff85/ffea -- the only prg_mode=3 sites -- are the
# standard MMC1 reset idiom, reached from RESET alone. The "mixed" reading was the reset being
# counted as a mode; there is no runtime mode switch. Without this hint the base blocks carry
# the mode-3 layout (W8000 8000-bfff + WC000 c000-ffff) that the game never executes in, so
# W8000_M0 has both 32 KiB banks as overlays and nothing in base.
#
# Unlike MMC3 (grm-3fvj), the mode cannot be recovered from the image at load time: MMC1's
# control register is written bit-serially (five one-bit writes, LSB first), so there is no
# LDA #imm / STA abs pair carrying the mode for NesRomLoader.imageResolvedMode to match on.
# This hint is the per-game tier's designed answer for exactly that -- a fact a human (or a
# prior analysis run) can establish in minutes but no byte scan can.
#
# prg_bank is deliberately NOT hinted: the analyzer's own recovery leaves it at the descriptor's
# initial 0, and in mode 0 the hardware ignores its LSB, so bank 0 (PRG[0x0000..0x8000)) is
# the resident 32 KiB image in base -- which is where every sampled reference already points.
#
# rcproam is a BISTABLE real-ROM row (grm-q1bi has a pending re-bless): do not read its
# refs/instrs count jitter as mode evidence, and sequence its bless with that bead's diff.

schema: 2

game:
  id: rcproam
  title: "RC Pro-Am (PRG 1) (U)"
  board: nes_mmc1
  identity:
    # PRG-slice SHA-256 (16-byte iNES header excluded, no trainer), copied from the
    # "REALROM prgsha256" line of tools/banktest/realrom/expected/rcproam.dump -- the same
    # value NesRomLoader.gameIdentity computes at import.
    prg_sha256: "7c75ab09008ae1240be2851d777c8ee9cd4c9ba6c020abd9986452c65776c225"
    # Whole-file SHA-256, copied from the rcproam row of tools/banktest/realrom/manifest-gme.tsv.
    file_sha256: "4aaaa0f1c125e96f2f76af926bec72f657a0331e80aeb697123be27cd81d870a"
  provenance: "Owner's GUI read of the pinned rcproam real ROM, 2026-09-19 (grm-hvc1): every
    control-register write sets the PRG-mode bits to 0; ff85/ffea (the only prg_mode=3 sites,
    the standard MMC1 reset idiom) are reached from RESET alone. The cartridge runs MMC1 32 KiB
    mode from init, not the control register's mode-3 reset value."

banking:
  # Field-NAME map, never a packed integer (the game tier does not know the board's bit
  # layout); folded in last, after banking.initial_state_expr, by
  # DescriptorSupport.applyGameInitialStateHint.
  initial_state: { prg_mode: 0 }
