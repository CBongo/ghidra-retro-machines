# Curated per-game descriptor (title tier). Compiled to data/games/smb3.gmap.
# docs/per-game-descriptors-design.md; first increment, bead grm-hb6.12.
#
# WHY THIS FILE HAS NO banking: SECTION ANY MORE (grm-3fvj, 2026-09-08). It used to carry
# `banking: initial_state: { prg_mode: 1 }`, because machines/nes-mmc3.yaml assumes prg_mode 0
# at power-on -- a conventional, honest guess, since MMC3 register contents are genuinely
# undefined at reset -- while this cartridge's init sets bank-select bit 6 unconditionally and
# so runs PRG mode 1. That hint is now REDUNDANT: NesRomLoader.imageResolvedMode derives the
# same fact from the image itself, and smb3 is the strongest witness in the corpus for it (69 of
# its 74 $8000 writes are LDA #imm, every one with bit 6 set). Verified by deleting the hint and
# re-running the row: smb3's real-ROM golden still matches byte for byte.
#
# THE FILE IS KEPT DELIBERATELY, as the per-game tier's worked exemplar -- identity (both hash
# forms) and provenance, which is what docs/per-game-descriptors-design.md documents and what
# grm-hb6.12 shipped. Deleting it would leave that tier with no live example. A descriptor with
# no banking: section is valid; GameCompiler.buildBanking simply emits none. Do NOT "fix" this
# by adding an empty banking.initial_state -- that is an error ("present but names no fields").
#
# If a future change makes the image scan decline on this ROM (it requires at least 4 agreeing
# LDA #imm/STA sites and unanimity), the hint can come straight back: it is one line, and the
# provenance below still records the hand pass that established the fact.

schema: 2

game:
  id: smb3
  title: "Super Mario Bros 3 (PRG 1) (U)"
  board: nes_mmc3
  identity:
    # PRG-slice SHA-256 (16-byte iNES header and any trainer excluded; this ROM has none) --
    # see docs/per-game-descriptors-design.md section 2.2. Verified two ways: recomputed by
    # hand from the pinned image the same way NesRomLoader.gameIdentity does (skip the 16-byte
    # header, no trainer, take prgBanks*16384 = 262144 bytes), and cross-checked against this
    # program's "Retro Machines.Game Identity" property after import.
    prg_sha256: "f4130ba655229d9999fa3b2c59984165810c9b9b125c43b1ff899872e7fedff4"
    # Whole-file SHA-256, copied from the smb3 row of tools/banktest/realrom/manifest.tsv
    # (docs/per-game-descriptors-design.md section 2.3's copy-from-the-manifest workflow).
    file_sha256: "4377a7f5e6eb50bdd2ac6f249bf1a7085500aca8eb41f38545c3a2731c51a579"
  provenance: "owner's hand pass over the pinned smb3 real-ROM row, 2026-09-07 (grm-3fvj): the
    $8000 bank-select write sets bit 6 (PRG mode) at every observed occurrence, i.e. this ROM
    runs MMC3 PRG mode 1 from init, not the board descriptor's mode-0 power-on convention."
