# NES GxROM/MHROM board descriptor (iNES mapper 66) — SHIPPING descriptor (bead grm-9ux M2).
# All hardware facts cross-checked against the NESdev wiki:
#   - https://www.nesdev.org/wiki/GxROM (board layout, latch behavior)
#   - https://www.nesdev.org/wiki/PPU_registers ($2000-$2007)
#   - https://www.nesdev.org/wiki/APU and /wiki/2A03 ($4000-$401F, test mode)
# GxROM switches the entire 32 KiB PRG window at once via a single latch write that also
# selects an 8 KiB CHR bank in the same byte (PRG in bits 4-5, CHR in bits 0-1). Only the
# PRG half is tracked here; CHR/PPU address space is deferred (vision doc §5.4). No
# PRG-RAM at $6000 in GxROM's basic config, so no region is declared for it.

schema: 2

include: fragments/nes-common.yaml

system:
  id: nes_gxrom
  name: NES GxROM/MHROM (iNES mapper 66)
  board:
    ines_mappers: [66]       # board registry key: iNES mapper numbers this board serves
  cpu:
    language: "6502:LE:16:default"   # 2A03 = 6502 minus decimal mode; stock language suffices

physical:
  # PRG ROM laid out once, in file order. No size: — it comes from the iNES header
  # (PRG-ROM size field).
  - { name: PRG, image: prg_rom }

memory:
  # No PRG-RAM region at $6000 — GxROM's basic config carries none.
  # PPU/CHR address space: out of scope for the CPU map (vision doc §5.4 defers non-CPU spaces).

  windows:
    - name: PRG_ALL                # whole 32 KiB switchable — no fixed bank
      start: 0x8000
      end: 0xFFFF
      maps: PRG[prg_bank * 0x8000]
      on_write: mechanism          # stores here are mapper latch writes, not memory writes

banking:
  state:
    - { name: prg_bank, bits: 2 }  # up to 128 KiB PRG (4 * 32 KiB)
  mechanisms:
    - strategy: memory-latch      # a store anywhere in [start,end] latches the bank
      # One write sets both PRG (bits 4-5, hence shift: 4) and CHR (bits 0-1) in the same
      # byte; the CHR half is untracked here (PPU space deferred). Bus-conflict behavior
      # varies across mapper-66 boards; false is the safe recovery assumption.
      params: { start: 0x8000, end: 0xFFFF, mask: 0x03, shift: 4, bus_conflict: false }
      sets: [prg_bank]
  # No states: table — occupants are computed from the maps: expressions, not enumerated.
  # Power-on latch state is electrically undefined; 0 is the conventional assumption.
  initial_state: { prg_bank: 0 }

# rom_images: omitted — PRG comes from the .nes container payload, not a user-supplied slot.

validation:
  oracle: Mesen
  checks:
    - "NES_PPU/NES_APU_IO struct offsets vs NESdev wiki PPU_registers and APU register tables"
    - "GxROM combined PRG/CHR latch byte (bits 4-5 PRG, bits 0-1 CHR) vs Mesen memory viewer / mapper 66 source"
