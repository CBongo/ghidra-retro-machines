# NES MMC1 board descriptor (iNES mapper 1) -- SHIPPING descriptor (bead grm-hsv.2).
# Builds directly on SerialShiftBankSwitchStrategy (bead grm-hsv.1) and its synthetic
# proving ground machines/nes-serialtest.yaml (iNES mapper 222): same mechanism, same
# banking.state shape, promoted to the real register/window layout and iNES mapper number.
#
# Hardware facts (NESdev wiki, https://www.nesdev.org/wiki/MMC1):
#   $8000-$FFFF (whole range, any address) = the 5-write bit-serial shift register. A
#   write with bit 7 set resets the shifter and forces prg_mode to 3 (fix-last); five
#   consecutive bit-7-clear writes each contribute one bit (LSB first), and the 5th
#   write's ADDRESS bits 14:13 select which of four registers the reassembled 5-bit
#   value commits to: 0 = Control (mirroring + prg_mode + chr_mode, only the first two
#   are modeled here), 1 = CHR bank 0, 2 = CHR bank 1, 3 = PRG bank. See
#   SerialShiftBankSwitchStrategy's class javadoc for the ground-truth (not
#   nesdev-wiki-idealized) instruction shapes real commercial games emit for this --
#   always a fully unrolled STA/LSR chain, never the wiki's canonical counted loop.
#
#   Control register bits 0-1 = mirroring (not modeled beyond tracking the field --
#   nametable mirroring is PPU-side, out of scope per vision doc §5.4), bits 2-3 =
#   prg_mode, bits 4 = chr_mode (deferred, see CHR note below).
#
#   prg_mode values:
#     0, 1: 32 KiB mode -- one window at $8000-$FFFF, PRG[(prg_bank >> 1) * 0x8000].
#           Real hardware IGNORES prg_bank's LSB in this mode (the bank register is
#           addressed in 16 KiB units everywhere else, but the 32K window only has half
#           as many possible positions) -- hence the `>>` in the maps: expression (bead
#           grm-hsv.2's grammar extension; see docs/SCHEMA.md / docs/MAP_FORMAT.md).
#           Modes 0 and 1 are ELECTRICALLY IDENTICAL on real hardware (the encoding just
#           has two bit patterns meaning "32K mode"); this descriptor still declares them
#           as two separate memory.layouts[] entries (matching nes-serialtest.yaml's
#           documented design) because DescriptorSupport.planWindows only invariant-hoists
#           a window that is defined identically across EVERY layout, and modes 2/3 below
#           are genuinely different -- so 0 and 1 stay two distinct-but-content-identical
#           varying-window instances rather than collapsing into one. See this file's
#           validation notes for what was verified about that runtime behavior.
#     2: fix-first -- $8000-$BFFF fixed to PRG bank 0, $C000-$FFFF switches on prg_bank.
#     3: fix-last (the reset-dance convention, and this descriptor's home mode) --
#        $8000-$BFFF switches on prg_bank, $C000-$FFFF fixed to the last bank.
#
#   CHR banking (targets 1/2, 4 KiB or 8 KiB PPU-side windows) is entirely out of scope
#   here (vision doc §5.4 defers non-CPU spaces) -- both targets are recognized by the
#   serial-shift mechanism (address bits 14:13 == 1 or 2) but have no `targets` entry, so
#   they are deliberately discarded no-ops on every tracked field, same contract as
#   nes-serialtest.yaml's CHR targets and SelectDataBankSwitchStrategy's untracked-select
#   case. chr_mode (Control bit 4) is likewise not a tracked banking.state field.
#
#   PRG RAM: many (not all) MMC1 boards carry 8 KiB of PRG RAM at $6000-$7FFF, sometimes
#   battery-backed (SOROM/SXROM variants add bank-switched or write-protectable PRG RAM
#   via a 5th shift-register target on some sub-boards). This descriptor models the plain
#   8 KiB window only; battery/bank-switched PRG RAM variants are noted, not modeled.
#
#   512 KiB PRG (SUROM/SOROM, "MMC1 with extra PRG"): on those boards, prg_bank's bit 4
#   (the field's MSB here) selects which 256 KiB half of PRG the other 4 bits' bank
#   number lives in -- effectively an extra outer bank register with no register of its
#   own (it rides along in the same 5-bit PRG commit). A byte-accurate window for that
#   would need PRG[(prg_bank & 0x0F) * 0x4000 + (prg_bank_hi ? 0x40000 : 0)] or similar,
#   which this descriptor's plain PRG[prg_bank * 0x4000] handles correctly ONLY up to
#   256 KiB (16 x 16 KiB banks fit in prg_bank's full 5-bit range already, so ordinary
#   128/256 KiB MMC1 carts need no special casing) -- the 512 KiB half-select is a
#   distinct, NOT-modeled future variant, flagged here rather than guessed at.

schema: 2

include: fragments/nes-common.yaml

system:
  id: nes_mmc1
  name: NES MMC1 (iNES mapper 1)
  board:
    ines_mappers: [1]        # board registry key: iNES mapper numbers this board serves
  cpu:
    # Stock 6502 language -- the 2A03 core is a 6502 minus decimal mode, invisible here.
    language: "6502:LE:16:default"

physical:
  # PRG ROM laid out once, in file order. No size: — it comes from the iNES header
  # (PRG-ROM size field) at load time.
  - { name: PRG, image: prg_rom }

memory:
  regions:                        # always visible, never banked
    - name: PRG_RAM
      start: 0x6000
      end: 0x7FFF
      kind: ram
      comment: "8 KiB PRG RAM, common but not universal on MMC1 boards; battery-backed
                (SXROM/SOROM/SUROM) and bank-switched/write-protectable variants are not
                modeled -- see the module note above."

  windows: []                     # every PRG window is mode-dependent -- see layouts

  layouts:
    # prg_mode 0/1 (32K mode, electrically identical on real MMC1 -- see module note
    # above): one 32 KiB window, byte-accurate via the `>>` maps: operator (bead
    # grm-hsv.2): the hardware ignores prg_bank's LSB in this mode.
    - when: { prg_mode: 0 }
      windows:
        - { name: W8000, start: 0x8000, size: 0x8000, maps: "PRG[(prg_bank >> 1) * 0x8000]", on_write: mechanism }
    - when: { prg_mode: 1 }
      windows:
        - { name: W8000, start: 0x8000, size: 0x8000, maps: "PRG[(prg_bank >> 1) * 0x8000]", on_write: mechanism }
    # prg_mode 2 (fix-first): W8000 fixed to bank 0, WC000 switches on prg_bank.
    - when: { prg_mode: 2 }
      windows:
        - { name: W8000, start: 0x8000, size: 0x4000, maps: "PRG[0]",              on_write: mechanism }
        - { name: WC000, start: 0xC000, size: 0x4000, maps: "PRG[prg_bank * 0x4000]", on_write: mechanism }
    # prg_mode 3 (fix-last, the reset-dance convention -- this board's home mode, matching
    # initial_state below): W8000 switches on prg_bank, WC000 fixed to the last bank.
    - when: { prg_mode: 3 }
      windows:
        - { name: W8000, start: 0x8000, size: 0x4000, maps: "PRG[prg_bank * 0x4000]", on_write: mechanism }
        - { name: WC000, start: 0xC000, size: 0x4000, maps: "PRG[last]",              on_write: mechanism }

banking:
  # prg_bank is 5 bits on EVERY MMC1, because that is the width of the serial shift
  # register -- but a 128 KiB cart has 8 banks and a 256 KiB cart 16, so the cartridge
  # simply does not carry the high PRG address lines and the board truncates. Same
  # hardware story as MMC5's, so the same DERIVED form: truncation here is by ROM size,
  # a property of the mapper rather than of any one cartridge's wiring, so the honest
  # spelling is "work it out from what this image has" (bead grm-p25h / grm-yxu8).
  # Absent, nothing wraps and a recovered out-of-range bank names no slice at all.
  #
  # WORKED CASE, and the reason this board was audited first: tmnt (128 KiB, 8 banks)
  # commits $1F at ffdd with all five prg_bank bits recovered as known-1. Without this
  # key that is an impossible bank -- there is no bank 31 -- and the site reports the
  # grm-fick "out of range in every reachable window" warning instead of resolving. With
  # it, 31 & 7 = 7, the last bank, which is what the hardware does.
  #
  # That answer is robust to the one modelling question this board has here, which is why
  # it is a safe first audit. On most MMC1 boards the PRG register's bit 4 is not a bank
  # bit at all -- it is PRG-RAM enable -- so the "real" bank in $1F is bits 0-3 = 15. This
  # descriptor models all five bits as prg_bank (see the 512 KiB note above, where bit 4
  # genuinely IS an address line). Both readings wrap to the same place on an 8-bank cart:
  # 31 & 7 = 7 and 15 & 7 = 7. So the annotation is correct whichever way bit 4 is read,
  # and nothing here depends on settling that question.
  #
  # tmnt is the ONLY row in the 33-row pinned corpus with an out-of-range MMC1 bank; every
  # other MMC1 row writes in range, where canonicalization is the identity and nothing
  # moves. Measured, not assumed -- see grm-yxu8 for the corpus-wide survey.
  #
  # 512 KiB (SUROM/SOROM) is unaffected either way: those carts realize all 32 banks, so
  # the derived mask is 0x1F and wrapping is the identity. The bit-4-selects-which-256-KiB-
  # half behaviour noted in the PRG comment above stays exactly as NOT-modeled as it was.
  bank_wrap: image
  state:
    # LSB-first packing: mirroring bits 0-1, prg_mode bits 2-3, prg_bank bits 4-8 (9 bits
    # total). chr_mode and the two CHR bank fields are deliberately NOT tracked fields --
    # see the CHR note above; this keeps the packed state exactly the bits this descriptor
    # actually reasons about, matching nes-serialtest.yaml's proving-ground shape.
    - { name: mirroring, bits: 2 }
    - { name: prg_mode,  bits: 2 }
    - { name: prg_bank,  bits: 5 }
  mechanisms:
    - strategy: serial-shift
      params:
        start: 0x8000
        end: 0xFFFF
        targets:
          # target index = write-5's address bits 14:13 within $8000-$FFFF (0=Control/
          # $8000-$9FFF, 1=CHR0/$A000-$BFFF, 2=CHR1/$C000-$DFFF, 3=PRG/$E000-$FFFF).
          # Real games write non-canonical addresses inside each register's 8 KiB window
          # (e.g. Final Fantasy's $9FFF/$BFFF/$DFFF/$FFF9) -- SerialShiftBankSwitchStrategy
          # decodes the target from the write's own address, not a fixed constant, so this
          # is handled with no descriptor-side special-casing.
          0: { fields: [ { name: mirroring, shift: 0, bits: 2 }, { name: prg_mode, shift: 2, bits: 2 } ] }
          3: { fields: [ { name: prg_bank, shift: 0, bits: 5 } ] }
        reset: { prg_mode: 3 }
      sets: [mirroring, prg_mode, prg_bank]
  # Power-on register contents are electrically undefined; the reset-dance convention
  # (every real MMC1 game's first act is a bit-7-set write, forcing prg_mode=3) is what
  # this descriptor assumes as its power-on truth too -- prg_mode=3 (fix-last, this
  # board's home mode), prg_bank=0, mirroring=0.
  initial_state: { mirroring: 0, prg_mode: 3, prg_bank: 0 }

# rom_images: omitted -- PRG comes from the .nes container payload, not a user-supplied slot.

validation:
  oracle: none
  checks:
    - "PRG-side bank layout, shift-register commit protocol, and reset-dance semantics
       cross-checked against the NESdev wiki (https://www.nesdev.org/wiki/MMC1); no
       emulator oracle run yet. Real-game instruction shapes (unrolled STA/LSR commit
       chains reached via a shared JSR'd helper, non-canonical in-window register
       addresses, reset writes to all four registers) cross-checked against verified
       mapper-1 commercial disassemblies (Legend of Zelda, Final Fantasy (US), Metroid --
       see the bead's ground-truth survey) rather than idealized nesdev-wiki pseudocode.
       Verified against the banktest suite's runtime behavior (bead grm-hsv.2,
       nesmmc1test.nes, Metroid-shaped: a JSR'd switch helper, two PRG-bank commits with
       a discarded CHR chain between them, a prg_mode 3->2 transition, and an
       unresolvable-argument helper call site). CHR banking, chr_mode, nametable
       mirroring, PRG-RAM write-protect/battery variants, and the SUROM/SOROM 256K/512K
       PRG half-select are all out of scope (vision doc §5.4 / this bead)."
