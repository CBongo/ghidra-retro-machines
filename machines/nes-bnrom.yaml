# NES BNROM board descriptor (iNES mapper 34) — SHIPPING descriptor (bead grm-9ux M2).
# All hardware facts cross-checked against the NESdev wiki:
#   - https://www.nesdev.org/wiki/INES_Mapper_034 (board layout, latch behavior)
#   - https://www.nesdev.org/wiki/PPU_registers ($2000-$2007)
#   - https://www.nesdev.org/wiki/APU and /wiki/2A03 ($4000-$401F, test mode)
# iNES mapper 34 is overloaded: it also designates NINA-001 (which banks via $7FFD-$7FFF
# writes and carries CHR-ROM, unlike BNROM's CHR-RAM). This descriptor assumes BNROM (the
# common case, e.g. Deadly Towers) — a NINA-001 image imported with it will misbehave and
# needs a manual board override once a dedicated NINA-001 descriptor exists.
# BNROM switches the entire 32 KiB PRG window at once; no fixed bank, so games must keep
# valid reset/NMI/IRQ vectors in every bank. CHR/PPU address space deferred (vision doc
# §5.4). No PRG-RAM at $6000 in BNROM's basic config, so no region is declared for it.

schema: 2

include: fragments/nes-common.yaml

system:
  id: nes_bnrom
  name: NES BNROM (iNES mapper 34)
  board:
    ines_mappers: [34]       # board registry key: iNES mapper numbers this board serves
  cpu:
    language: "6502:LE:16:default"   # 2A03 = 6502 minus decimal mode; stock language suffices

physical:
  # PRG ROM laid out once, in file order. No size: — it comes from the iNES header
  # (PRG-ROM size field).
  - { name: PRG, image: prg_rom }

memory:
  # No PRG-RAM region at $6000 — BNROM's basic config carries none.
  # PPU/CHR address space: out of scope for the CPU map (vision doc §5.4 defers non-CPU spaces).

  windows:
    - name: PRG_ALL                # whole 32 KiB switchable — no fixed bank
      start: 0x8000
      end: 0xFFFF
      maps: PRG[bank * 0x8000]
      on_write: mechanism          # stores here are mapper latch writes, not memory writes

banking:
  state:
    - { name: bank, bits: 2 }      # up to 128 KiB PRG (4 * 32 KiB)
  mechanisms:
    - strategy: memory-latch      # a store anywhere in [start,end] latches the bank
      params: { start: 0x8000, end: 0xFFFF, mask: 0x03, bus_conflict: true }
      sets: [bank]
  # No states: table — occupants are computed from the maps: expressions, not enumerated.
  # Power-on latch state is electrically undefined; 0 is the conventional assumption.
  initial_state: { bank: 0 }

# rom_images: omitted — PRG comes from the .nes container payload, not a user-supplied slot.

validation:
  oracle: Mesen
  checks:
    - "NES_PPU/NES_APU_IO struct offsets vs NESdev wiki PPU_registers and APU register tables"
    - "BNROM 32 KiB whole-window latch (no fixed bank) vs Mesen memory viewer / mapper 34 (BNROM) source"
