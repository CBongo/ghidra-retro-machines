// Builds a Ghidra Extension for a given Ghidra installation.
//
// An absolute path to the Ghidra installation directory must be supplied either by setting the 
// GHIDRA_INSTALL_DIR environment variable or Gradle project property:
//
//     > export GHIDRA_INSTALL_DIR=<Absolute path to Ghidra> 
//     > gradle
//
//         or
//
//     > gradle -PGHIDRA_INSTALL_DIR=<Absolute path to Ghidra>
//
// (Per upstream, the environment variable takes precedence over the -P property.)
//
// This project adds a third, lower-precedence option for a development machine: name the
// directory Ghidra installs live UNDER, once, in the machine-local ~/.gradle/gradle.properties,
// and let the version come from this repo's gradle.properties (ghidraTargetVersion):
//
//     ghidraInstallRoot=<Absolute path to the directory holding ghidra_<ver>_PUBLIC>
//     > gradle
//
// Use a trailing FORWARD slash ("<drive>:/"): a bare drive letter is drive-relative on Windows,
// and a trailing backslash is a .properties line-continuation.
//
// Because it sits below the stock branches, GHIDRA_INSTALL_DIR -- if set at all -- wins and this
// is skipped entirely. Blank it for a single invocation to fall through to ghidraInstallRoot
// without touching the machine's environment:
//
//     > GHIDRA_INSTALL_DIR= gradle buildExtension
//
// That assigns the EMPTY STRING rather than unsetting the variable; it works because the stock
// branch below is a Groovy truthiness test and "" is falsy. Do not "tighten" that condition to
// `!= null` -- it would silently break this escape hatch, which is the only in-place remedy for
// a stale env var inherited by a long-running shell or agent session (`env -u
// GHIDRA_INSTALL_DIR gradle ...` is the equivalent that truly unsets).
//
// Gradle should be invoked from the directory of the project to build.  Please see the
// application.gradle.version property in <GHIDRA_INSTALL_DIR>/Ghidra/application.properties
// for the correction version of Gradle to use for the Ghidra installation you specify.

//----------------------START "DO NOT MODIFY" SECTION------------------------------
def ghidraInstallDir

if (System.env.GHIDRA_INSTALL_DIR) {
	ghidraInstallDir = System.env.GHIDRA_INSTALL_DIR
}
else if (project.hasProperty("GHIDRA_INSTALL_DIR")) {
	ghidraInstallDir = project.getProperty("GHIDRA_INSTALL_DIR")
}
else if (project.hasProperty("ghidraInstallRoot")) {
	// Added below the two stock branches, so upstream precedence is untouched: this fires only
	// when neither GHIDRA_INSTALL_DIR form is supplied. It separates the two concerns that were
	// previously conflated in one absolute path -- WHERE Ghidra installs live (ghidraInstallRoot,
	// set once in the machine-local ~/.gradle/gradle.properties, so no developer drive letter is
	// ever committed) from WHICH version this project targets (gradle.properties'
	// ghidraTargetVersion, the single source of truth, bead grm-9r7). Retargeting is then one
	// line in gradle.properties and nothing outside the repo needs touching -- useful when
	// several ghidra_<ver>_PUBLIC installs sit side by side.
	//
	// ghidraInstallRoot needs a trailing FORWARD slash (e.g. "D:/"). A bare drive letter is
	// drive-RELATIVE on Windows ("D:" means the current directory on D:, composing to
	// "D:ghidra_<ver>_PUBLIC"), and .properties treats "\" as an escape character, so a trailing
	// backslash is read as a line-continuation and silently leaves the bare drive letter.
	ghidraInstallDir = new File(project.property("ghidraInstallRoot").toString(),
		"ghidra_${project.property('ghidraTargetVersion')}_PUBLIC").path
}
else {
	ghidraInstallDir = "<REPLACE>"
}

// Targeted-version guard (bead grm-9r7): gradle.properties' ghidraTargetVersion is the single
// source of truth for which Ghidra this extension targets. The stock resolution above lets the
// GHIDRA_INSTALL_DIR env var silently win over -P flags, so a stale env var would otherwise
// build against the wrong Ghidra with no warning; instead, compare the resolved install's own
// application.properties and fail loudly on any mismatch.
def ghidraTargetVersion = project.property('ghidraTargetVersion')
def ghidraInstallHint = "set ghidraInstallRoot=<dir holding ghidra_${ghidraTargetVersion}_PUBLIC> " +
	"in ~/.gradle/gradle.properties (absolute, trailing FORWARD slash), or pass " +
	"-PGHIDRA_INSTALL_DIR=<install> for this invocation"
def ghidraAppPropsFile = new File(ghidraInstallDir, 'Ghidra/application.properties')
if (!ghidraAppPropsFile.isFile()) {
	throw new GradleException("Resolved Ghidra install '${ghidraInstallDir}' is not a " +
		"Ghidra install (no Ghidra/application.properties). This project targets Ghidra " +
		"${ghidraTargetVersion} -- ${ghidraInstallHint}.")
}
def ghidraInstalledVersion = new Properties().with { props ->
	ghidraAppPropsFile.withInputStream { props.load(it) }
	props.getProperty('application.version')
}
if (ghidraInstalledVersion != ghidraTargetVersion) {
	throw new GradleException("Resolved Ghidra install is ${ghidraInstalledVersion} " +
		"(${ghidraInstallDir}) but this project targets ${ghidraTargetVersion} " +
		"(gradle.properties: ghidraTargetVersion). Either ${ghidraInstallHint}, or update " +
		"ghidraTargetVersion when deliberately retargeting. NOTE a GHIDRA_INSTALL_DIR env var " +
		"wins over both (upstream precedence) and is snapshotted when a shell starts, so a " +
		"stale one cannot be corrected in place -- blank it for this run with " +
		"'GHIDRA_INSTALL_DIR= gradle <task>' to fall through to ghidraInstallRoot.")
}

task distributeExtension {
	group = "Ghidra"

	apply from: new File(ghidraInstallDir).getCanonicalPath() + "/support/buildExtension.gradle"
	dependsOn ':buildExtension'
}
//----------------------END "DO NOT MODIFY" SECTION-------------------------------

repositories {
	// Declare dependency repositories here.  This is not needed if dependencies are manually
	// dropped into the lib/ directory.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html for more info.
	// Ex: mavenCentral()

	// Only used to resolve the build-time gdtBuilder dependencies below (snakeyaml). Nothing
	// resolved through this repository is added to the shipped extension's runtime lib/.
	mavenCentral()
}

dependencies {
	// Any external dependencies added here will automatically be copied to the lib/ directory when
	// this extension is built.
}

//----------------------------------------------------------------------------------
// What ships in the extension zip (bead grm-6gl).
//
// This is the hook the stock build.gradle skeleton reserves for `buildExtension.exclude`.
// We drive it from an ALLOWLIST rather than writing excludes by hand, deliberately.
//
// Why: buildExtension (in <ghidra>/support/buildExtension.gradle, which our DO NOT MODIFY
// section applies) builds the zip from three child copy specs -- the token-filtered
// extension.properties, project.jar into lib/, and `from(project.projectDir)` carrying a
// FIXED, Eclipse-era exclude list (build, *.gradle, dist, bin, src, .gradle, .vscode,
// .classpath, .project, .settings, gradlew...). That denylist knows nothing about this
// repo's layout, so it packaged the whole working tree: .beads (the 30 MB Dolt issue-tracker
// DB), .claude, .agents, .codex, docs, machines, tools, gradle.properties -- a 31 MB zip
// delivering 0.4 MB of extension, and a copy of the project issue tracker dropped into every
// user's Ghidra Extensions dir.
//
// A denylist has the wrong failure mode: forget to add the next new top-level dir and it
// ships silently (exactly how this bug arose). The allowlist below fails the safe way --
// forget an entry and the resource is MISSING, which the acceptance gate catches loudly.
//
// Mechanics: the patterns are drawn from projectDir's own top-level entries, so although
// Gradle propagates parent-spec excludes to the child specs, they cannot match the child
// specs' files (the jar is `ghidra-retro-machines.jar`, the source zip
// `ghidra-retro-machines-src.zip`; neither is a top-level projectDir entry, and
// extension.properties -- which is -- is on the allowlist). That is why this is expressed as
// generated excludes and NOT as a root-level `include`, which would filter those children out.
//----------------------------------------------------------------------------------

// Top-level entries the extension is allowed to ship.
//   data                 -- runtime-required: loaders read data/machines/<id>.map and the
//                           .gdt archives via Application.findDataFileInAnyModule, and
//                           NesBoardRegistry scans data/ for *.map
//                           (Application.findFilesByExtensionInMyModule searches the module's
//                           data dir only); also carries data/languages (bundled sleigh) and
//                           data/ExtensionPoint.manifest.
//   extension.properties,
//   Module.manifest      -- Ghidra-required extension metadata.
//   ghidra_scripts       -- Ghidra-required module dir; carries the shipped script front-ends
//                           (RunFromElsewhereTransfer.java, bead grm-1.7.1.1).
//   lib                  -- the jar + -src.zip; produced by buildExtension's own child specs
//                           rather than copied from projectDir, listed here for clarity.
//   README.md, LICENSE,
//   NOTICE               -- what a user unpacking the extension should find. NOTICE records
//                           attribution for vendored third-party material shipped inside
//                           data/ (currently data/languages/6510_illegal.sinc, Apache-2.0),
//                           so it has to travel with the extension, not just the repo.
// Everything else at the top level -- .agents, .beads, .claude, .codex, AGENTS.md, CLAUDE.md,
// docs, gsrc, gradle.properties, machines, tools -- is repo/build-time material. In
// particular machines/ holds the authored YAML that gdtBuilder compiles INTO data/ at build
// time; nothing reads it at runtime.
def SHIPPED_TOP_LEVEL = [
	'lib', 'data', 'ghidra_scripts', 'extension.properties', 'Module.manifest',
	'README.md', 'LICENSE', 'NOTICE'
] as Set

projectDir.listFiles().each { f ->
	if (!(f.name in SHIPPED_TOP_LEVEL)) {
		buildExtension.exclude f.name
		buildExtension.exclude f.name + '/**'
	}
}

// Fail loudly if an allowlisted path that must exist on disk has gone missing, so a rename
// can't quietly turn "shipped" into "excluded by omission". (lib/ is intentionally absent:
// buildExtension synthesizes it.)
['data', 'extension.properties', 'Module.manifest'].each { required ->
	if (!new File(projectDir, required).exists()) {
		throw new GradleException("Extension packaging allowlist (bead grm-6gl) names " +
			"'${required}', but it does not exist in ${projectDir}. Update SHIPPED_TOP_LEVEL " +
			"in build.gradle if the layout changed deliberately.")
	}
}

//----------------------------------------------------------------------------------
// YAML -> .gdt data-type archive build pipeline (bead grm-1.5).
//
// docs/SCHEMA.md "Resolved decisions" #1: struct/enum definitions live canonically in
// the machine descriptor YAML (`types:` section); the .gdt archive is a generated build
// artifact (never committed — see .gitignore) produced here and consumed by the runtime
// extension ONLY via the standard Ghidra archive API. There is deliberately no YAML
// parser in the shipped extension: the builder below (source set `gdtBuilder`) and its
// snakeyaml dependency are build-only and are never copied into the extension's lib/,
// because they live in a separate source set / configuration from `main` and
// `dependencies {}` above (which is what buildExtension.gradle copies).
//----------------------------------------------------------------------------------

// The gdtBuilder source set holds the build-time descriptor toolchain (MapCompiler,
// GdtBuilder, YamlSupport, PetsciiCompiler, ScreencodeCompiler) driven by the buildXxxGdt/
// buildXxxMap/buildPetsciiMap/buildScreencodeMap JavaExec tasks below. The former
// bitAlgebraCheck/petsciiCheck/charsetCheck source sets and their verify* JavaExec tasks
// were retired in bead grm-32f.4: those hand-rolled main()+System.exit verifiers are now
// standard JUnit @Test classes under src/test/java, run by the `test` task (see below).
sourceSets {
	gdtBuilder {
		java {
			srcDirs = ['tools/gdtbuilder/src/main/java']
		}
	}
}

dependencies {
	// Ghidra's own jars, needed to construct DataTypeManager/StructureDataType/etc.
	// standalone (outside the Ghidra GUI/headless-analyzer process). Build-only: this
	// configuration (gdtBuilderImplementation) is independent of the extension's runtime
	// `dependencies {}` block above and is never packaged.
	gdtBuilderImplementation fileTree(dir: ghidraInstallDir, includes: [
		'Ghidra/Framework/*/lib/*.jar',
		'Ghidra/Features/*/lib/*.jar'
	])

	// YAML parsing for the builder only; never shipped (see note above).
	gdtBuilderImplementation 'org.yaml:snakeyaml:2.2'

	// JUnit layer (bead grm-32f.1 spike; verifiers migrated in grm-32f.4): the `test` source
	// set is supplied by the `java` plugin (srcDir src/test/java) -- only its dependencies and
	// task config are added here. Mirrors the gdtBuilder classpath pattern above: Ghidra's own
	// jars already carry AbstractGenericTest (Generic.jar) and ProgramBuilder (Base.jar)
	// compiled in, plus gson (Generic/lib) used by PetsciiMapper/MapCompiler, so no Ghidra
	// source is compiled for tests, only linked against. sourceSets.main.output carries the
	// retromachines/charset classes AND the staged classpath resources
	// (META-INF/services/java.nio.charset.spi.CharsetProvider + retromachines/charset/*.map,
	// via processResources -> stageCharsetResources) that RetroCharsetProviderTest's
	// ServiceLoader discovery and PetsciiMapperTest's map load both depend on. JUnit4 (not 5)
	// + hamcrest come from Maven since Ghidra's shipped test scaffolding needs them at runtime;
	// the `test` task below uses useJUnit() (vintage), not useJUnitPlatform().
	testImplementation fileTree(dir: ghidraInstallDir, includes: [
		'Ghidra/Framework/*/lib/*.jar', 'Ghidra/Features/*/lib/*.jar'])
	testImplementation sourceSets.main.output
	testImplementation sourceSets.gdtBuilder.output
	// MapCompiler reads its descriptor via snakeyaml (YamlSupport); sourceSets.gdtBuilder.output
	// carries only its compiled classes, not that build-only dep, and Ghidra ships no
	// snakeyaml on the fileTree above -- so the test runtime needs it explicitly, same
	// version the gdtBuilder set uses.
	testImplementation 'org.yaml:snakeyaml:2.2'
	testImplementation 'junit:junit:4.13.2'
	testImplementation 'org.hamcrest:hamcrest:2.2'
}

// Data-driven per-machine task generation (bead grm-9ux): one buildXxxGdt/buildXxxMap
// task pair per machines/*.yaml descriptor, instead of hand-written tasks per machine.
def machineGdtTasks = []
def machineMapTasks = []

// Incremental-build inputs for the descriptor pipeline (bead grm-c9f). These are plain
// JavaExec tasks, which declare no inputs/outputs of their own, so without this every
// `gradle buildExtension` -- including every tools/install-gui.ps1 run -- re-forked one JVM
// per machine per artifact to recompile byte-identical .gdt/.map files from unchanged YAML.
//
// A descriptor's own .yaml is NOT a sufficient input. Both compilers reach further:
//   * YamlSupport.loadComposed follows `include:` directives, resolved relative to the
//     descriptor's own directory (today: machines/fragments/nes-common.yaml);
//   * MapCompiler and GdtBuilder both resolve `source:` keys (register sets, type defs) the
//     same relative way (today: machines/generated/*.yaml).
// So the shared input set is "everything under machines/ EXCEPT the sibling top-level
// descriptors" -- which keeps editing one board from rebuilding the other twelve, while
// staying correct for any new shared subdirectory someone adds later (it is covered
// automatically, rather than needing to be remembered here). The one shape this does not
// cover is a top-level descriptor including another top-level descriptor; there are none,
// and a board composed from a sibling board would want its own fragment anyway.
//
// The compiled builder classes are an input too: editing MapCompiler/GdtBuilder must
// invalidate what they emit. sourceSets.gdtBuilder.output also carries the task dependency
// on compileGdtBuilderJava implicitly, but the explicit dependsOn below is kept for clarity.
// ('*.yaml' is an Ant-style pattern anchored at the tree root and a single '*' does not cross
// '/', so this drops machines/c64.yaml but keeps machines/generated/*.yaml and
// machines/fragments/*.yaml -- exactly the "shared, not sibling" split described above.)
def descriptorSharedInputs = fileTree(dir: 'machines', excludes: ['*.yaml'])

fileTree(dir: 'machines', include: '*.yaml').each { yamlFile ->
	def baseName = yamlFile.name.replace('.yaml', '')
	// Capitalize each hyphen-separated component so e.g. nes-uxrom -> NesUxrom, yielding
	// valid task names buildNesUxromGdt / buildNesUxromMap.
	def taskId = baseName.split('-').collect { it.capitalize() }.join('')

	def gdtTask = tasks.create("build${taskId}Gdt", JavaExec) {
		group = "Ghidra Retro Machines"
		description = "Generate data/machines/${baseName}.gdt from machines/${yamlFile.name} (build artifact; never committed)"
		dependsOn 'compileGdtBuilderJava'
		classpath = sourceSets.gdtBuilder.runtimeClasspath
		mainClass = 'gdtbuilder.GdtBuilder'
		doFirst {
			file('data/machines').mkdirs()
		}
		args = [
			yamlFile.absolutePath,
			file("data/machines/${baseName}.gdt").absolutePath
		]

		inputs.file(yamlFile)
		inputs.files(descriptorSharedInputs)
		inputs.files(sourceSets.gdtBuilder.output)
		outputs.file(file("data/machines/${baseName}.gdt"))
	}
	machineGdtTasks << gdtTask

	def mapTask = tasks.create("build${taskId}Map", JavaExec) {
		group = "Ghidra Retro Machines"
		description = "Generate data/machines/${baseName}.map from machines/${yamlFile.name} (build artifact; never committed)"
		dependsOn 'compileGdtBuilderJava'
		classpath = sourceSets.gdtBuilder.runtimeClasspath
		mainClass = 'gdtbuilder.MapCompiler'
		doFirst {
			file('data/machines').mkdirs()
		}
		args = [
			yamlFile.absolutePath,
			file("data/machines/${baseName}.map").absolutePath
		]

		inputs.file(yamlFile)
		inputs.files(descriptorSharedInputs)
		inputs.files(sourceSets.gdtBuilder.output)
		outputs.file(file("data/machines/${baseName}.map"))
	}
	machineMapTasks << mapTask
}

task buildGdt {
	group = "Ghidra Retro Machines"
	description = "Generate all machine .gdt data-type archives from their YAML descriptors"
	dependsOn machineGdtTasks
}

task buildMap {
	group = "Ghidra Retro Machines"
	description = "Generate all machine .map runtime files from their YAML descriptors"
	dependsOn machineMapTasks
}

// PETSCII byte -> display-string map (bead grm-1.4.1). A small, separate compiler from
// MapCompiler on purpose: MapCompiler builds descriptor-schema-2 machine descriptors and
// hard-validates that schema (physical spaces, banking state, windows...), none of which
// applies to petscii.yaml's much simpler byte-table schema. See
// machines/generated/petscii.yaml and docs/petscii.md for the frozen convention.
task buildPetsciiMap(type: JavaExec) {
	group = "Ghidra Retro Machines"
	description = "Generate data/petscii.map from machines/generated/petscii.yaml (build artifact; never committed)"
	dependsOn 'compileGdtBuilderJava'
	classpath = sourceSets.gdtBuilder.runtimeClasspath
	mainClass = 'gdtbuilder.PetsciiCompiler'
	doFirst {
		file('data').mkdirs()
	}
	args = [
		file('machines/generated/petscii.yaml').absolutePath,
		file('data/petscii.map').absolutePath
	]

	// Incremental inputs (bead grm-c9f). Unlike the machine descriptors above, PetsciiCompiler
	// does a plain YamlSupport.load -- no `include:`/`source:` resolution -- so the single
	// descriptor plus the builder classes is the complete input set.
	inputs.file('machines/generated/petscii.yaml')
	inputs.files(sourceSets.gdtBuilder.output)
	outputs.file(file('data/petscii.map'))
}

// C64 screen-code (VIC-II screen RAM byte value) -> Unicode map (bead grm-1.4.5). Mirrors
// buildPetsciiMap exactly, except ScreencodeCompiler also reads petscii.yaml (for its
// already-verified unicode layer -- see machines/generated/screencode.yaml's header for why
// screen codes are expressed as a permutation of PETSCII bytes rather than a second literal
// codepoint table).
task buildScreencodeMap(type: JavaExec) {
	group = "Ghidra Retro Machines"
	description = "Generate data/screencode.map from machines/generated/{petscii,screencode}.yaml (build artifact; never committed)"
	dependsOn 'compileGdtBuilderJava'
	classpath = sourceSets.gdtBuilder.runtimeClasspath
	mainClass = 'gdtbuilder.ScreencodeCompiler'
	doFirst {
		file('data').mkdirs()
	}
	args = [
		file('machines/generated/petscii.yaml').absolutePath,
		file('machines/generated/screencode.yaml').absolutePath,
		file('data/screencode.map').absolutePath
	]

	// Incremental inputs (bead grm-c9f). Both descriptors are inputs -- ScreencodeCompiler
	// reads petscii.yaml for its unicode layer as well as screencode.yaml -- and both are
	// plain loads, so this is the complete set.
	inputs.file('machines/generated/petscii.yaml')
	inputs.file('machines/generated/screencode.yaml')
	inputs.files(sourceSets.gdtBuilder.output)
	outputs.file(file('data/screencode.map'))
}

//----------------------------------------------------------------------------------
// Charset SPI resource staging (bead grm-1.4 Phase C).
//
// retromachines.charset.RetroCharsetProvider loads its tables via
// getClass().getResourceAsStream("/retromachines/charset/petscii.map") and (as of bead
// grm-1.4.5) ".../screencode.map" -- i.e. as plain classpath resources, not through Ghidra's
// Application/data-file resolution (that's what makes the provider usable from a bare
// ServiceLoader, see src/test/java/retromachines/RetroCharsetProviderTest.java). Gradle's
// default resource root (src/main/resources) can't hold data/petscii.map itself, since that
// file is a gitignored build artifact generated by buildPetsciiMap, not checked-in source --
// so it is staged into a second, generated resources root instead of being duplicated.
//----------------------------------------------------------------------------------

task stageCharsetResources(type: Copy) {
	group = "Ghidra Retro Machines"
	description = "Stage data/petscii.map and data/screencode.map as classpath resources for retromachines.charset.RetroCharsetProvider"
	dependsOn 'buildPetsciiMap', 'buildScreencodeMap'
	from('data') {
		include 'petscii.map', 'screencode.map'
	}
	into 'build/generated-resources/retromachines/charset'
}

sourceSets.main.resources.srcDir 'build/generated-resources'

processResources {
	dependsOn 'stageCharsetResources'
}

task validateSketches {
	group = "Ghidra Retro Machines"
	description = "Compile every machines/sketches/*.yaml through MapCompiler to prove the schema can express it (grm-os4 acceptance; outputs under build/sketches, never shipped)"
	dependsOn 'compileGdtBuilderJava'
	doLast {
		fileTree(dir: 'machines/sketches', include: '*.yaml').each { sketch ->
			def out = file("build/sketches/${sketch.name.replace('.yaml', '.map')}")
			out.parentFile.mkdirs()
			javaexec {
				classpath = sourceSets.gdtBuilder.runtimeClasspath
				mainClass = 'gdtbuilder.MapCompiler'
				args = [sketch.absolutePath, out.absolutePath]
			}
		}
	}
}

// `gradle test` runs the src/test/java JUnit suite through Ghidra's own shipped test
// scaffolding (AbstractGenericTest, ProgramBuilder). As of bead grm-32f.4 it is also the home
// of the migrated verifiers -- the former verifyBitAlgebra / verifyPetsciiMapper /
// verifyCharsets / verifyDescriptorComposition / verifyMapCompiler JavaExec tasks are now
// @Test classes here (BitAlgebraEquivalenceTest, PetsciiMapperTest, RetroCharsetProviderTest,
// DescriptorCompositionTest, MapCompilerTest), giving per-assertion reporting instead of the
// old first-mismatch System.exit. The banktest acceptance gate (tools/banktest/
// build-and-test.sh) invokes this task in place of those verify* tasks; whole-suite vs.
// per-chunk test selection is bead grm-32f.5. Deliberately NOT wired into buildExtension's
// dependsOn: buildExtension stays packaging-only, and the gate runs `test` explicitly.
//
// RetroCharsetProviderTest note (the grm-32f.4 caveat, resolved): a Gradle Test-worker fork
// puts the test runtime classpath on the JVM system classpath, so Charset.forName(...) still
// exercises the REAL java.util.ServiceLoader SPI discovery of RetroCharsetProvider here --
// verified green -- exactly as the old JavaExec classpath did. The staged
// META-INF/services/java.nio.charset.spi.CharsetProvider + retromachines/charset/*.map
// resources reach the fork via testImplementation sourceSets.main.output (processResources).
test {
	useJUnit()
	maxHeapSize = '2g'
	environment 'GHIDRA_INSTALL_DIR', ghidraInstallDir

	// Bundled-language visibility for Tier-2 tests (bead grm-2pi). Ghidra finds languages by
	// scanning module data dirs, not the classpath, and the stock test layout only discovers
	// modules under the Ghidra install -- so data/languages/*.ldefs is invisible to JUnit by
	// default. AbstractBundledLanguageTest grafts this module into the test application
	// layout; it needs to be told where the module is, and needs the .sla to exist first
	// (sleighCompile's output is gitignored, so a fresh checkout has none).
	dependsOn 'sleighCompile'
	systemProperty 'grm.moduleDir', projectDir.absolutePath

	// Spc700VectorSampleTest's baseline-regeneration switch (bead grm-c9d.2) must be forwarded
	// explicitly: `test` forks a separate worker JVM that does NOT inherit -D properties from
	// the launching `gradle` invocation, so `gradle test -Dgrm.spc700.regenerateBaseline=true`
	// would otherwise silently do nothing -- the test sees no property, finds no baseline,
	// Assume-skips, and the run reports GREEN. That is a failure in the flattering direction
	// (a green run masking "the regeneration never happened"), the exact shape this project
	// treats as worse than an honest red, so it is forwarded here rather than left as a footgun.
	// Unlike an inherited environment variable, a `-D` given on the `gradle` command line IS
	// read fresh by the Gradle client on every invocation (it is not subject to the daemon's
	// stale-environment-at-startup problem documented in CLAUDE.md for GHIDRA_INSTALL_DIR), so
	// a plain conditional read at configuration time is sufficient here.
	if (System.getProperty('grm.spc700.regenerateBaseline') != null) {
		systemProperty 'grm.spc700.regenerateBaseline',
			System.getProperty('grm.spc700.regenerateBaseline')
	}

	// Spc700VectorExhaustiveTest (bead grm-c9d.2) is its OWN chunk (`spc700-vectors`), not part
	// of `unit`/`all`: it needs a large, user-supplied vector clone (GRM_SPC700_VECTORS) this
	// repo cannot ship, mirroring why the real-ROM tier is excluded from the default gate. If it
	// ran here too, `unit`/`all` would fail loudly (by design -- see that test's class doc)
	// every time GRM_SPC700_VECTORS is unset, which is nearly always. spc700VectorTest below
	// runs it, and only it.
	exclude '**/vectors/Spc700VectorExhaustiveTest.class'
}

// The exhaustive SPC700 vector regression (bead grm-c9d.2), split out of `test` per the comment
// above. Mirrors `test`'s own config (bundled-language visibility, GHIDRA_INSTALL_DIR) since
// Spc700VectorExhaustiveTest needs the same bundled-module grafting as everything else under
// AbstractBundledLanguageTest.
task spc700VectorTest(type: Test) {
	group = "Ghidra Retro Machines"
	description = "Exhaustive SPC700 vector regression (grm-c9d.2); requires GRM_SPC700_VECTORS " +
		"(refuses loudly otherwise). Not part of `test`/`unit`/`all` -- see build-and-test.sh's " +
		"`spc700-vectors` chunk."
	useJUnit()
	// 512m, not `test`'s 2g: with VectorRunner's periodic emulator rebuild (grm-c9d.3 increment
	// 10, VectorRunner.DEFAULT_REBUILD_INTERVAL) bounding the per-run growth of
	// AbstractPcodeMachine's thread registry, a full ~256,000-case exhaustive run needs nowhere
	// near what it used to -- measured reliably passing at 128m and OOMing at 64m, so 512m keeps
	// a 4x margin over the measured floor rather than chasing the exact byte. Before the rebuild
	// fix this task needed 9g (see the increment 9/10 reports): unbounded thread-registry growth
	// across all 256,000 cases in one JVM, which the project owner ruled unacceptable on this
	// 16 GB dev machine for what is meant to be routine local verification.
	maxHeapSize = '512m'
	environment 'GHIDRA_INSTALL_DIR', ghidraInstallDir
	dependsOn 'sleighCompile'
	systemProperty 'grm.moduleDir', projectDir.absolutePath
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	include '**/vectors/Spc700VectorExhaustiveTest.class'

	// Spc700VectorExhaustiveTest's OWN baseline-regeneration switch (grm-c9d.3 increment 6),
	// deliberately a different -D property from `test`'s grm.spc700.regenerateBaseline above --
	// forwarded here for the identical reason: this is a separate Test task with its own forked
	// worker JVM, which does NOT inherit -D properties from the launching `gradle` invocation
	// (nor from the `test` task's config block above, since spc700VectorTest is a wholly separate
	// task, not a variant of `test`). Without this block, `gradle spc700VectorTest
	// -Dgrm.spc700.regenerateExhaustiveBaseline=true` would silently no-op: the test would see no
	// property, fall through to comparing against the existing baseline instead of regenerating
	// it, most likely fail on drift, or -- worse -- pass and look like nothing happened. Verified
	// by hand: without this block the property never reaches the forked worker.
	if (System.getProperty('grm.spc700.regenerateExhaustiveBaseline') != null) {
		systemProperty 'grm.spc700.regenerateExhaustiveBaseline',
			System.getProperty('grm.spc700.regenerateExhaustiveBaseline')
	}
}

//----------------------------------------------------------------------------------
// Bundled sleigh language build (bead grm-bk6): compile data/languages/*.slaspec -> .sla.
//
// buildExtension.gradle does NOT compile sleigh, and Ghidra ships languages pre-compiled,
// so an extension that bundles a processor language must compile it itself. This mirrors
// the canonical mechanism in <ghidra>/Extensions/Ghidra/Skeleton/data/buildLanguage.xml:
// run ghidra.pcodeCPort.slgh_compile.SleighCompile with the SoftwareModeling/Generic/
// Utility lib jars on the classpath (antlr lives among them), passing '-a' to compile
// every .slaspec in data/languages. The produced .sla sits beside its .slaspec and is
// packaged into the extension by buildExtension (which ships data/).
//----------------------------------------------------------------------------------

task sleighCompile(type: JavaExec) {
	group = "Ghidra Retro Machines"
	description = "Compile bundled sleigh languages (data/languages/*.slaspec -> .sla)"
	mainClass = 'ghidra.pcodeCPort.slgh_compile.SleighCompile'
	classpath = files(
		fileTree(dir: ghidraInstallDir + '/Ghidra/Framework/SoftwareModeling/lib', include: '*.jar'),
		fileTree(dir: ghidraInstallDir + '/Ghidra/Framework/Generic/lib', include: '*.jar'),
		fileTree(dir: ghidraInstallDir + '/Ghidra/Framework/Utility/lib', include: '*.jar')
	)
	jvmArgs = ['-Xmx2048M']
	workingDir = file('data')
	// '-a' compiles every language in the dir; sleighArgs.txt carries per-module options.
	args = ['-i', 'sleighArgs.txt', '-a', './languages']

	inputs.files(fileTree(dir: 'data/languages', includes: ['*.slaspec', '*.sinc', '*.pspec', '*.cspec', '*.ldefs']))
	outputs.files(fileTree(dir: 'data/languages', include: '*.sla'))
}

// buildExtension is defined by the applied support/buildExtension.gradle (invoked via the
// distributeExtension task above); it doesn't exist at this file's configuration time, so
// attach the dependency lazily once Gradle resolves the task graph.
tasks.matching { it.name == 'buildExtension' }.configureEach {
	// buildPetsciiMap must be here too: data/petscii.map is a gitignored build
	// artifact that ships in the extension zip, and C64BasicAnalyzer needs it at
	// runtime (PetsciiMapper.load()). Without this dependency a fresh checkout
	// (e.g. a new git worktree) built a zip with no petscii.map and the C64 BASIC
	// detokenizer silently produced nothing (found by bead grm-r3h's worktree
	// smoke test; previously masked by a stale petscii.map in the main tree).
	// buildScreencodeMap (bead grm-1.4.5) ships data/screencode.map for the same
	// reason -- RetroCharsetProvider's screen-code charsets need it at runtime.
	dependsOn 'buildGdt', 'buildMap', 'buildPetsciiMap', 'buildScreencodeMap', 'sleighCompile'
}
