// Builds a Ghidra Extension for a given Ghidra installation.
//
// An absolute path to the Ghidra installation directory must be supplied either by setting the 
// GHIDRA_INSTALL_DIR environment variable or Gradle project property:
//
//     > export GHIDRA_INSTALL_DIR=<Absolute path to Ghidra> 
//     > gradle
//
//         or
//
//     > gradle -PGHIDRA_INSTALL_DIR=<Absolute path to Ghidra>
//
// Gradle should be invoked from the directory of the project to build.  Please see the
// application.gradle.version property in <GHIDRA_INSTALL_DIR>/Ghidra/application.properties
// for the correction version of Gradle to use for the Ghidra installation you specify.

//----------------------START "DO NOT MODIFY" SECTION------------------------------
def ghidraInstallDir

if (System.env.GHIDRA_INSTALL_DIR) {
	ghidraInstallDir = System.env.GHIDRA_INSTALL_DIR
}
else if (project.hasProperty("GHIDRA_INSTALL_DIR")) {
	ghidraInstallDir = project.getProperty("GHIDRA_INSTALL_DIR")
}
else {
	ghidraInstallDir = "<REPLACE>"
}

// Targeted-version guard (bead grm-9r7): gradle.properties' ghidraTargetVersion is the single
// source of truth for which Ghidra this extension targets. The stock resolution above lets the
// GHIDRA_INSTALL_DIR env var silently win over -P flags, so a stale env var would otherwise
// build against the wrong Ghidra with no warning; instead, compare the resolved install's own
// application.properties and fail loudly on any mismatch.
def ghidraTargetVersion = project.property('ghidraTargetVersion')
def ghidraAppPropsFile = new File(ghidraInstallDir, 'Ghidra/application.properties')
if (!ghidraAppPropsFile.isFile()) {
	throw new GradleException("Resolved GHIDRA_INSTALL_DIR '${ghidraInstallDir}' is not a " +
		"Ghidra install (no Ghidra/application.properties). This project targets Ghidra " +
		"${ghidraTargetVersion} -- expected at D:/ghidra_${ghidraTargetVersion}_PUBLIC.")
}
def ghidraInstalledVersion = new Properties().with { props ->
	ghidraAppPropsFile.withInputStream { props.load(it) }
	props.getProperty('application.version')
}
if (ghidraInstalledVersion != ghidraTargetVersion) {
	throw new GradleException("Resolved Ghidra install is ${ghidraInstalledVersion} " +
		"(${ghidraInstallDir}) but this project targets ${ghidraTargetVersion} " +
		"(gradle.properties: ghidraTargetVersion). Set " +
		"GHIDRA_INSTALL_DIR=D:/ghidra_${ghidraTargetVersion}_PUBLIC for this invocation, or " +
		"update ghidraTargetVersion when deliberately retargeting.")
}

task distributeExtension {
	group = "Ghidra"

	apply from: new File(ghidraInstallDir).getCanonicalPath() + "/support/buildExtension.gradle"
	dependsOn ':buildExtension'
}
//----------------------END "DO NOT MODIFY" SECTION-------------------------------

repositories {
	// Declare dependency repositories here.  This is not needed if dependencies are manually
	// dropped into the lib/ directory.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html for more info.
	// Ex: mavenCentral()

	// Only used to resolve the build-time gdtBuilder dependencies below (snakeyaml). Nothing
	// resolved through this repository is added to the shipped extension's runtime lib/.
	mavenCentral()
}

dependencies {
	// Any external dependencies added here will automatically be copied to the lib/ directory when
	// this extension is built.
}

// Exclude additional files from the built extension
// Ex: buildExtension.exclude '.idea/**'

//----------------------------------------------------------------------------------
// YAML -> .gdt data-type archive build pipeline (bead grm-1.5).
//
// docs/SCHEMA.md "Resolved decisions" #1: struct/enum definitions live canonically in
// the machine descriptor YAML (`types:` section); the .gdt archive is a generated build
// artifact (never committed — see .gitignore) produced here and consumed by the runtime
// extension ONLY via the standard Ghidra archive API. There is deliberately no YAML
// parser in the shipped extension: the builder below (source set `gdtBuilder`) and its
// snakeyaml dependency are build-only and are never copied into the extension's lib/,
// because they live in a separate source set / configuration from `main` and
// `dependencies {}` above (which is what buildExtension.gradle copies).
//----------------------------------------------------------------------------------

// The gdtBuilder source set holds the build-time descriptor toolchain (MapCompiler,
// GdtBuilder, YamlSupport, PetsciiCompiler, ScreencodeCompiler) driven by the buildXxxGdt/
// buildXxxMap/buildPetsciiMap/buildScreencodeMap JavaExec tasks below. The former
// bitAlgebraCheck/petsciiCheck/charsetCheck source sets and their verify* JavaExec tasks
// were retired in bead grm-32f.4: those hand-rolled main()+System.exit verifiers are now
// standard JUnit @Test classes under src/test/java, run by the `test` task (see below).
sourceSets {
	gdtBuilder {
		java {
			srcDirs = ['tools/gdtbuilder/src/main/java']
		}
	}
}

dependencies {
	// Ghidra's own jars, needed to construct DataTypeManager/StructureDataType/etc.
	// standalone (outside the Ghidra GUI/headless-analyzer process). Build-only: this
	// configuration (gdtBuilderImplementation) is independent of the extension's runtime
	// `dependencies {}` block above and is never packaged.
	gdtBuilderImplementation fileTree(dir: ghidraInstallDir, includes: [
		'Ghidra/Framework/*/lib/*.jar',
		'Ghidra/Features/*/lib/*.jar'
	])

	// YAML parsing for the builder only; never shipped (see note above).
	gdtBuilderImplementation 'org.yaml:snakeyaml:2.2'

	// JUnit layer (bead grm-32f.1 spike; verifiers migrated in grm-32f.4): the `test` source
	// set is supplied by the `java` plugin (srcDir src/test/java) -- only its dependencies and
	// task config are added here. Mirrors the gdtBuilder classpath pattern above: Ghidra's own
	// jars already carry AbstractGenericTest (Generic.jar) and ProgramBuilder (Base.jar)
	// compiled in, plus gson (Generic/lib) used by PetsciiMapper/MapCompiler, so no Ghidra
	// source is compiled for tests, only linked against. sourceSets.main.output carries the
	// retromachines/charset classes AND the staged classpath resources
	// (META-INF/services/java.nio.charset.spi.CharsetProvider + retromachines/charset/*.map,
	// via processResources -> stageCharsetResources) that RetroCharsetProviderTest's
	// ServiceLoader discovery and PetsciiMapperTest's map load both depend on. JUnit4 (not 5)
	// + hamcrest come from Maven since Ghidra's shipped test scaffolding needs them at runtime;
	// the `test` task below uses useJUnit() (vintage), not useJUnitPlatform().
	testImplementation fileTree(dir: ghidraInstallDir, includes: [
		'Ghidra/Framework/*/lib/*.jar', 'Ghidra/Features/*/lib/*.jar'])
	testImplementation sourceSets.main.output
	testImplementation sourceSets.gdtBuilder.output
	// MapCompiler reads its descriptor via snakeyaml (YamlSupport); sourceSets.gdtBuilder.output
	// carries only its compiled classes, not that build-only dep, and Ghidra ships no
	// snakeyaml on the fileTree above -- so the test runtime needs it explicitly, same
	// version the gdtBuilder set uses.
	testImplementation 'org.yaml:snakeyaml:2.2'
	testImplementation 'junit:junit:4.13.2'
	testImplementation 'org.hamcrest:hamcrest:2.2'
}

// Data-driven per-machine task generation (bead grm-9ux): one buildXxxGdt/buildXxxMap
// task pair per machines/*.yaml descriptor, instead of hand-written tasks per machine.
def machineGdtTasks = []
def machineMapTasks = []

fileTree(dir: 'machines', include: '*.yaml').each { yamlFile ->
	def baseName = yamlFile.name.replace('.yaml', '')
	// Capitalize each hyphen-separated component so e.g. nes-uxrom -> NesUxrom, yielding
	// valid task names buildNesUxromGdt / buildNesUxromMap.
	def taskId = baseName.split('-').collect { it.capitalize() }.join('')

	def gdtTask = tasks.create("build${taskId}Gdt", JavaExec) {
		group = "Ghidra Retro Machines"
		description = "Generate data/machines/${baseName}.gdt from machines/${yamlFile.name} (build artifact; never committed)"
		dependsOn 'compileGdtBuilderJava'
		classpath = sourceSets.gdtBuilder.runtimeClasspath
		mainClass = 'gdtbuilder.GdtBuilder'
		doFirst {
			file('data/machines').mkdirs()
		}
		args = [
			yamlFile.absolutePath,
			file("data/machines/${baseName}.gdt").absolutePath
		]
	}
	machineGdtTasks << gdtTask

	def mapTask = tasks.create("build${taskId}Map", JavaExec) {
		group = "Ghidra Retro Machines"
		description = "Generate data/machines/${baseName}.map from machines/${yamlFile.name} (build artifact; never committed)"
		dependsOn 'compileGdtBuilderJava'
		classpath = sourceSets.gdtBuilder.runtimeClasspath
		mainClass = 'gdtbuilder.MapCompiler'
		doFirst {
			file('data/machines').mkdirs()
		}
		args = [
			yamlFile.absolutePath,
			file("data/machines/${baseName}.map").absolutePath
		]
	}
	machineMapTasks << mapTask
}

task buildGdt {
	group = "Ghidra Retro Machines"
	description = "Generate all machine .gdt data-type archives from their YAML descriptors"
	dependsOn machineGdtTasks
}

task buildMap {
	group = "Ghidra Retro Machines"
	description = "Generate all machine .map runtime files from their YAML descriptors"
	dependsOn machineMapTasks
}

// PETSCII byte -> display-string map (bead grm-1.4.1). A small, separate compiler from
// MapCompiler on purpose: MapCompiler builds descriptor-schema-2 machine descriptors and
// hard-validates that schema (physical spaces, banking state, windows...), none of which
// applies to petscii.yaml's much simpler byte-table schema. See
// machines/generated/petscii.yaml and docs/petscii.md for the frozen convention.
task buildPetsciiMap(type: JavaExec) {
	group = "Ghidra Retro Machines"
	description = "Generate data/petscii.map from machines/generated/petscii.yaml (build artifact; never committed)"
	dependsOn 'compileGdtBuilderJava'
	classpath = sourceSets.gdtBuilder.runtimeClasspath
	mainClass = 'gdtbuilder.PetsciiCompiler'
	doFirst {
		file('data').mkdirs()
	}
	args = [
		file('machines/generated/petscii.yaml').absolutePath,
		file('data/petscii.map').absolutePath
	]
}

// C64 screen-code (VIC-II screen RAM byte value) -> Unicode map (bead grm-1.4.5). Mirrors
// buildPetsciiMap exactly, except ScreencodeCompiler also reads petscii.yaml (for its
// already-verified unicode layer -- see machines/generated/screencode.yaml's header for why
// screen codes are expressed as a permutation of PETSCII bytes rather than a second literal
// codepoint table).
task buildScreencodeMap(type: JavaExec) {
	group = "Ghidra Retro Machines"
	description = "Generate data/screencode.map from machines/generated/{petscii,screencode}.yaml (build artifact; never committed)"
	dependsOn 'compileGdtBuilderJava'
	classpath = sourceSets.gdtBuilder.runtimeClasspath
	mainClass = 'gdtbuilder.ScreencodeCompiler'
	doFirst {
		file('data').mkdirs()
	}
	args = [
		file('machines/generated/petscii.yaml').absolutePath,
		file('machines/generated/screencode.yaml').absolutePath,
		file('data/screencode.map').absolutePath
	]
}

//----------------------------------------------------------------------------------
// Charset SPI resource staging (bead grm-1.4 Phase C).
//
// retromachines.charset.RetroCharsetProvider loads its tables via
// getClass().getResourceAsStream("/retromachines/charset/petscii.map") and (as of bead
// grm-1.4.5) ".../screencode.map" -- i.e. as plain classpath resources, not through Ghidra's
// Application/data-file resolution (that's what makes the provider usable from a bare
// ServiceLoader, see src/test/java/retromachines/RetroCharsetProviderTest.java). Gradle's
// default resource root (src/main/resources) can't hold data/petscii.map itself, since that
// file is a gitignored build artifact generated by buildPetsciiMap, not checked-in source --
// so it is staged into a second, generated resources root instead of being duplicated.
//----------------------------------------------------------------------------------

task stageCharsetResources(type: Copy) {
	group = "Ghidra Retro Machines"
	description = "Stage data/petscii.map and data/screencode.map as classpath resources for retromachines.charset.RetroCharsetProvider"
	dependsOn 'buildPetsciiMap', 'buildScreencodeMap'
	from('data') {
		include 'petscii.map', 'screencode.map'
	}
	into 'build/generated-resources/retromachines/charset'
}

sourceSets.main.resources.srcDir 'build/generated-resources'

processResources {
	dependsOn 'stageCharsetResources'
}

task validateSketches {
	group = "Ghidra Retro Machines"
	description = "Compile every machines/sketches/*.yaml through MapCompiler to prove the schema can express it (grm-os4 acceptance; outputs under build/sketches, never shipped)"
	dependsOn 'compileGdtBuilderJava'
	doLast {
		fileTree(dir: 'machines/sketches', include: '*.yaml').each { sketch ->
			def out = file("build/sketches/${sketch.name.replace('.yaml', '.map')}")
			out.parentFile.mkdirs()
			javaexec {
				classpath = sourceSets.gdtBuilder.runtimeClasspath
				mainClass = 'gdtbuilder.MapCompiler'
				args = [sketch.absolutePath, out.absolutePath]
			}
		}
	}
}

// `gradle test` runs the src/test/java JUnit suite through Ghidra's own shipped test
// scaffolding (AbstractGenericTest, ProgramBuilder). As of bead grm-32f.4 it is also the home
// of the migrated verifiers -- the former verifyBitAlgebra / verifyPetsciiMapper /
// verifyCharsets / verifyDescriptorComposition / verifyMapCompiler JavaExec tasks are now
// @Test classes here (BitAlgebraEquivalenceTest, PetsciiMapperTest, RetroCharsetProviderTest,
// DescriptorCompositionTest, MapCompilerTest), giving per-assertion reporting instead of the
// old first-mismatch System.exit. The banktest acceptance gate (tools/banktest/
// build-and-test.sh) invokes this task in place of those verify* tasks; whole-suite vs.
// per-chunk test selection is bead grm-32f.5. Deliberately NOT wired into buildExtension's
// dependsOn: buildExtension stays packaging-only, and the gate runs `test` explicitly.
//
// RetroCharsetProviderTest note (the grm-32f.4 caveat, resolved): a Gradle Test-worker fork
// puts the test runtime classpath on the JVM system classpath, so Charset.forName(...) still
// exercises the REAL java.util.ServiceLoader SPI discovery of RetroCharsetProvider here --
// verified green -- exactly as the old JavaExec classpath did. The staged
// META-INF/services/java.nio.charset.spi.CharsetProvider + retromachines/charset/*.map
// resources reach the fork via testImplementation sourceSets.main.output (processResources).
test {
	useJUnit()
	maxHeapSize = '2g'
	environment 'GHIDRA_INSTALL_DIR', ghidraInstallDir
}

//----------------------------------------------------------------------------------
// Bundled sleigh language build (bead grm-bk6): compile data/languages/*.slaspec -> .sla.
//
// buildExtension.gradle does NOT compile sleigh, and Ghidra ships languages pre-compiled,
// so an extension that bundles a processor language must compile it itself. This mirrors
// the canonical mechanism in <ghidra>/Extensions/Ghidra/Skeleton/data/buildLanguage.xml:
// run ghidra.pcodeCPort.slgh_compile.SleighCompile with the SoftwareModeling/Generic/
// Utility lib jars on the classpath (antlr lives among them), passing '-a' to compile
// every .slaspec in data/languages. The produced .sla sits beside its .slaspec and is
// packaged into the extension by buildExtension (which ships data/).
//----------------------------------------------------------------------------------

task sleighCompile(type: JavaExec) {
	group = "Ghidra Retro Machines"
	description = "Compile bundled sleigh languages (data/languages/*.slaspec -> .sla)"
	mainClass = 'ghidra.pcodeCPort.slgh_compile.SleighCompile'
	classpath = files(
		fileTree(dir: ghidraInstallDir + '/Ghidra/Framework/SoftwareModeling/lib', include: '*.jar'),
		fileTree(dir: ghidraInstallDir + '/Ghidra/Framework/Generic/lib', include: '*.jar'),
		fileTree(dir: ghidraInstallDir + '/Ghidra/Framework/Utility/lib', include: '*.jar')
	)
	jvmArgs = ['-Xmx2048M']
	workingDir = file('data')
	// '-a' compiles every language in the dir; sleighArgs.txt carries per-module options.
	args = ['-i', 'sleighArgs.txt', '-a', './languages']

	inputs.files(fileTree(dir: 'data/languages', includes: ['*.slaspec', '*.sinc', '*.pspec', '*.cspec', '*.ldefs']))
	outputs.files(fileTree(dir: 'data/languages', include: '*.sla'))
}

// buildExtension is defined by the applied support/buildExtension.gradle (invoked via the
// distributeExtension task above); it doesn't exist at this file's configuration time, so
// attach the dependency lazily once Gradle resolves the task graph.
tasks.matching { it.name == 'buildExtension' }.configureEach {
	// buildPetsciiMap must be here too: data/petscii.map is a gitignored build
	// artifact that ships in the extension zip, and C64BasicAnalyzer needs it at
	// runtime (PetsciiMapper.load()). Without this dependency a fresh checkout
	// (e.g. a new git worktree) built a zip with no petscii.map and the C64 BASIC
	// detokenizer silently produced nothing (found by bead grm-r3h's worktree
	// smoke test; previously masked by a stale petscii.map in the main tree).
	// buildScreencodeMap (bead grm-1.4.5) ships data/screencode.map for the same
	// reason -- RetroCharsetProvider's screen-code charsets need it at runtime.
	dependsOn 'buildGdt', 'buildMap', 'buildPetsciiMap', 'buildScreencodeMap', 'sleighCompile'
}
